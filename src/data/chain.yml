# 认知链路（第二坐标轴）—— 8 站的唯一事实源。
#
# 为什么需要它：
#   13 个学科领域回答「这个名词属于哪个学科」（用于查阅），
#   但读者问的是「我该先理解什么」（用于学习）。这两件事需要两套坐标。
#   站里原先只有一套，于是 325 个平级入口实际等于零个入口。
#
# 这 8 站不是第 14 个领域，而是词条的第二套坐标：
#   每个词条同时拥有 domain（档案柜的哪一格）与 chain（理解路径的第几站）。
#   前者服务「我知道要找什么」，后者服务「我不知道要找什么」。两套必须并存。
#
# 整条链路回答的是同一类问题：语言模型缺什么，每一层补什么。
#
# 约束（由 src/lib/content/schema.ts 的 chainStationSchema 与
# scripts/check-content-quality.ts 执行）：
#   · 恰好 8 站，order 为 1..8 的连续序列；
#   · 每站 coreTerms 3–5 个，且必须是真实存在的词条 id；
#   · 相邻两站 coreTerms 重叠不超过 1 个（否则分站失去意义）。

- id: foundation
  order: 1
  nameZh: 地基 · 模型是什么
  question: 它为什么不是检索，又为什么必然会编？
  goal: 说清语言模型在做什么——按概率续写下一段文本，而不是查资料库；因此「编」是它的默认行为，不是故障。
  coreTerms: [large-language-model, token, context-window, hallucination]
  action: 用同一个问题问同一个模型两次（temperature 调到 0 以上），把两次回答的差异记下来——这个差异就是「它在续写、不在检索」的直接证据。

- id: communication
  order: 2
  nameZh: 沟通 · 怎么把需求说清楚
  question: 为什么同样的模型，别人用得比你好？
  goal: 明白输出质量的差距主要来自你给的上下文与约束，而不是模型本身。
  coreTerms: [prompt, context-engineering, system-prompt, few-shot-prompting]
  action: 挑一件你反复交代的任务，把它写成一段带角色、目标、输出格式、禁止项的系统提示词，再跑一次，对比前后差异。

- id: knowledge
  order: 3
  nameZh: 给知识 · 怎么让它知道你家的资料
  question: 怎么让它答我司的内部问题？
  goal: 理解 RAG 的完整链路——切片、向量化、检索、重排——以及每一环出错时最终答案会怎样变形。
  coreTerms:
    [retrieval-augmented-generation, document-chunking, embedding, vector-database, reranking]
  action: 拿 5 份真实文档跑一次检索，故意问一个资料里没有的问题，看系统是拒答还是编。

- id: hands
  order: 4
  nameZh: 给手脚 · 怎么让它做事
  question: 怎么从给答案变成把事办完？
  goal: 看懂 Agent 与「会聊天的模型」的差别在于工具、规划、记忆，以及人在哪一步介入。
  coreTerms: [ai-agent, tool-use, agent-planning, agent-memory, human-in-the-loop]
  action: 给模型两个工具（读文件 + 写文件），让它完成一次多步任务，观察你在哪一步必须介入。

- id: interface
  order: 5
  nameZh: 给接口 · 怎么标准化地接系统
  question: 为什么每个工具不再各接一遍？
  goal: 说清 MCP 的三个角色（Host / Client / Server）与它解决的问题——把「每个模型 × 每个工具」的对接矩阵收敛成一次实现。
  coreTerms: [model-context-protocol, api-call, model-api, model-serving]
  action: 装一个官方 MCP Server，确认它的工具出现在客户端列表里，并让它读到你本地的一个文件。

- id: flow
  order: 6
  nameZh: 给流程 · 怎么把做法沉淀下来
  question: 怎么不每次都从头教一遍？
  goal: 理解 Skill / SOP 这层抽象——把「这件事该怎么做」写成可复用的模块，而不是每次重述一遍提示词。
  coreTerms: [prompt-template, prompt-chaining, agentic-workflow, workflow-automation]
  action: 把上一站跑通的那套提示词，连同它的参考资料整理成一个可复用的文件夹（何时用、步骤、输出要求），下次直接调用。

- id: judgment
  order: 7
  nameZh: 给判断 · 怎么知道它行不行
  question: 上线之后，你凭什么说它变好了？
  goal: 掌握评估与观测的基本动作——先有评测集，再谈好坏；先能观测，再谈优化。
  coreTerms: [evaluation, eval-set, llm-as-judge, observability, groundedness]
  action: 为你的场景写 10 条有标准答案的测试题，跑一遍并记录通过率，作为后续任何改动的对照基线。

- id: safety
  order: 8
  nameZh: 给安全 · 什么时候必须有人管
  question: 哪些动作永远不能让模型自己决定？
  goal: 划出必须保留人工与权限边界的那条线——护栏、最小授权、人在回路。
  coreTerms: [ai-guardrail, human-oversight, prompt-injection, ai-risk-management]
  action: 列出你的场景里「做错了就很难撤回」的 3 个动作（如转账、删除、对外发送），为每一个指定一个必须存在的确认环节。
