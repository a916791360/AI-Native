turing-test: 通过观察机器对话能否让评审者误判其为人类，讨论机器是否表现出类似智能的思想实验与评估方法。
expert-system: 使用知识库和推理规则模拟特定领域专家判断过程的人工智能系统，适合规则相对明确的问题。
symbolic-ai: 用符号、逻辑和显式规则表示知识并执行推理的人工智能范式，强调过程可表达和可检查。
connectionism: 通过大量简单计算单元及其连接学习模式的研究范式，是现代神经网络发展的重要思想来源。
ai-winter: 人工智能因能力预期落空、投资下降和研究资源收缩而经历的低潮时期。
narrow-ai: 面向有限任务和明确边界设计的人工智能，只在训练或配置的范围内表现能力。
artificial-general-intelligence: 假设能够跨任务学习、迁移并完成广泛认知工作的通用人工智能目标，目前仍未实现。
machine-intelligence: 机器在感知、学习、推理或决策任务中呈现的能力总称，用于讨论智能表现而非意识判断。
knowledge-representation: 将事实、概念、规则及其关系组织成机器可处理形式的方法，为推理和检索提供基础。
machine-learning: 让系统从数据和反馈中学习模式并改进任务表现的方法，是现代人工智能的重要实现路径。
supervised-learning: 使用带有目标标签的样本训练模型，使其学习输入与期望输出之间映射关系的机器学习方法。
unsupervised-learning: 在没有明确目标标签的数据中发现结构、分组或表示规律的机器学习方法。
reinforcement-learning: 智能体通过与环境交互并依据奖励信号调整策略，以提高长期回报的学习方法。
neural-network: 由分层连接的计算单元组成、通过调整权重学习输入与输出关系的模型结构。
deep-learning: 使用多层神经网络从大量数据中自动学习复杂表示和任务规律的机器学习方法。
training-data: 用于让模型学习参数、模式或行为的数据集合，其范围和质量直接影响模型能力与偏差。
feature-engineering: 根据任务知识选择、转换或构造输入特征，使机器学习模型更容易识别有效规律的过程。
classification: 将输入判断为一个或多个离散类别的预测任务，例如垃圾邮件识别或意图分类。
regression: 根据输入预测连续数值的机器学习任务，例如需求量、价格或处理时长估计。
foundation-model: 在大规模广泛数据上训练、能够适配多种下游任务并作为其他应用基础的模型。
transformer: 以注意力机制处理序列关系、支持高并行训练的神经网络架构，是现代大语言模型的基础。
attention-mechanism: 让模型在处理当前信息时动态分配权重，聚焦输入中更相关部分的计算机制。
self-attention: 在同一序列内部计算各位置之间相关性的注意力机制，用于形成包含上下文的信息表示。
tokenizer: 按既定词表和规则把文本转换为 Token 序列，并在输出阶段完成反向解码的组件。
pretraining: 在大规模通用数据上先学习基础表示和规律，再适配具体任务或交互目标的训练阶段。
post-training: 在预训练之后通过指令数据、偏好反馈或安全方法调整模型行为与可用性的训练阶段。
prompt: 提供给模型的指令、问题、背景或示例，用于表达当前任务和期望输出。
system-prompt: 在一次模型交互中设定总体角色、规则和行为边界的高层指令，通常由应用提供。
user-prompt: 用户在当前轮次提交的任务、问题和上下文，是模型生成回答的直接输入之一。
zero-shot-prompting: 不提供示例，仅通过任务说明和约束让模型完成新任务的提示方式。
few-shot-prompting: 在提示中提供少量输入输出示例，帮助模型从上下文推断任务模式和格式。
chain-of-thought: 通过要求或示范中间推理步骤来改善复杂任务表现的提示方法，不等同于可靠事实保证。
prompt-template: 把固定指令结构与可替换变量组合起来的提示格式，便于复用、版本管理和测试。
context-engineering: 围绕任务选择、组织和更新指令、数据、历史与工具结果，使模型获得合适工作信息的实践。
grounding: 用输入资料、检索证据或明确事实边界约束模型输出，使内容能够追溯到给定依据。
multimodal-ai: 能够处理或生成文本、图像、音频、视频等两种以上信息模态的人工智能系统。
vision-language-model: 联合处理视觉信息与语言指令，能够执行图像理解、描述或视觉问答的模型。
image-generation: 根据文本、图像或其他条件合成新图像内容的生成式人工智能任务。
text-to-image: 依据自然语言描述生成对应图像的任务，输出质量受提示、模型和采样设置共同影响。
image-to-image: 在输入图像基础上按指令改变风格、结构或局部内容的图像生成方式。
diffusion-model: 通过学习逐步去除噪声来生成数据的模型家族，广泛用于图像和视频合成。
computer-vision: 让机器从图像或视频中识别对象、场景、文字和空间关系的技术领域。
image-understanding: 从图像中识别对象、属性、场景和语义关系，并形成可供任务使用的信息。
optical-character-recognition: 从扫描件、照片或屏幕图像中检测并转换文字内容的技术。
speech-recognition: 将人类语音信号转换为文字或结构化语言信息的技术，是语音交互的输入环节。
data-ingestion: 把外部文件、数据库或业务系统中的数据接入处理管线，并保留必要来源和权限信息的过程。
document-parsing: 从文档中提取文字、结构、表格和元数据，使后续切片、索引与检索可以使用这些内容。
metadata-filtering: 在检索时利用时间、权限、类型或业务标签缩小候选范围，避免不适用内容进入结果。
keyword-search: 根据查询词与文档词项的精确或统计匹配查找内容的检索方式，擅长专有名词和明确表达。
ai-agent: 能够围绕目标管理状态、选择步骤并调用工具执行任务的 AI 系统形态。
autonomous-agent: 在较少人工逐步指令下持续规划并执行任务的智能体，通常需要更严格的权限和停止条件。
agentic-workflow: 把模型决策嵌入预定义步骤、工具和检查点的工作流，在灵活性与可控性之间取舍。
tool-use: 模型根据任务选择并调用外部工具，再利用返回结果继续推理或生成输出的能力。
function-calling: 模型按约定结构选择函数并生成参数，由应用执行函数后把结果返回模型的调用机制。
model-context-protocol: 以统一方式向 AI 应用提供工具、资源和提示上下文的开放协议，便于连接外部系统。
computer-use: AI 通过识别界面并执行点击、输入或滚动等操作来完成计算机任务的能力。
browser-use: AI 在浏览器中导航页面、读取状态并执行交互操作的工具使用场景。
code-execution: 在受控运行环境中执行代码并读取结果的能力，需要隔离权限、资源和输出。
api-call: 按接口协议向外部服务发送请求并处理响应，是 AI 工具调用和系统集成的常见方式。
ai-product: 以人工智能能力解决用户问题，并对质量、成本、风险和人机分工负责的产品。
ai-use-case: 将具体用户任务、可用数据和 AI 能力组合成可评估价值与风险的应用场景。
problem-solution-fit: 验证解决方案是否真正缓解目标用户的重要问题，是进入规模化投入前的产品判断。
human-ai-collaboration: 人与 AI 按各自优势分配生成、判断、执行和复核职责的工作方式。
copilot-pattern: 由 AI 提供建议或草稿、用户保留关键决策与最终控制权的人机协作模式。
autopilot-pattern: 由 AI 在授权范围内自主执行连续步骤、只在例外或高风险节点请求人工介入的模式。
progressive-disclosure: 先呈现当前任务必需的信息和控制，再按用户需要逐步展示高级选项的界面原则。
confidence-calibration: 让系统表达的确定程度与实际正确概率尽量一致，以支持更合理的人类判断。
uncertainty-display: 在界面中明确呈现模型的不确定性、证据缺口或需要复核之处的设计方式。
explanation-interface: 向用户展示 AI 建议依据、影响因素或可追溯证据的产品界面。
evaluation: 用明确任务、数据和标准衡量 AI 系统表现，并据此发现问题和指导改进的过程。
eval-set: 为固定评估目标组织的输入、期望结果和必要标签集合，用于可重复比较模型或系统版本。
benchmark: 使用公开或内部统一任务和指标比较模型、方法或系统表现的基准测试。
golden-dataset: 经过人工审查、可作为高可信参照的评估数据集，用于判断输出是否满足预期。
offline-evaluation: 在上线前或离线数据上运行的可重复评估，适合快速比较版本但不能完全替代真实使用观察。
online-evaluation: 在真实或受控线上流量中观察系统效果的评估，需要同时控制实验风险和用户影响。
human-evaluation: 由人类依据量规判断输出质量、偏好或风险的评估方式，适合机器指标难以覆盖的维度。
automatic-evaluation: 使用规则、程序或模型自动计算结果质量的评估方式，效率高但需要验证指标有效性。
llm-as-judge: 使用大语言模型依据量规评价其他输出的方法，需控制位置偏差、自我偏好和不稳定性。
ai-application: 将模型、数据、提示、工具和界面组合起来，为用户提供完整任务能力的软件应用。
model-api: 通过网络接口向应用提供模型推理能力的服务契约，通常定义输入、输出、鉴权和限额。
inference-server: 接收请求、调度模型计算并返回结果的服务组件，负责并发、批处理和资源管理。
model-serving: 把训练完成的模型部署为稳定可调用服务，并持续管理性能、版本和容量的工程过程。
model-deployment: 将模型及其依赖发布到目标运行环境，使应用可以在受控条件下调用的过程。
containerization: 把应用代码、运行时和依赖打包成隔离容器，以提高部署的一致性和可移植性。
gpu-serving: 使用 GPU 承载模型推理并管理显存、并发和调度的服务方式，适合计算密集模型。
request-batching: 将多个推理请求合并为一批执行，以提高硬件利用率但可能增加单个请求等待时间。
streaming-response: 在完整结果生成前持续向用户发送部分输出，以降低等待感并支持提前阅读。
response-caching: 保存可复用的模型响应，在条件匹配时直接返回，以减少延迟和重复推理成本。
ai-safety: 识别并降低 AI 系统可能造成伤害、失控或滥用风险的研究与工程实践。
responsible-ai: 在设计、开发和使用 AI 时落实公平、透明、安全、隐私和责任要求的原则与实践。
ai-governance: 组织用于决定 AI 权限、责任、审查、监控和问责方式的制度与管理体系。
ai-risk-management: 持续识别、评估、处置和监控 AI 风险，使控制措施与具体场景和影响相匹配。
privacy: 个人或组织控制其信息如何被收集、使用、共享和保留的权利与实践。
data-protection: 通过法律、流程和技术措施防止数据被未授权访问、滥用、泄露或丢失。
data-governance: 围绕数据质量、权限、生命周期、责任和使用规则建立的组织管理体系。
informed-consent: 在充分理解用途、风险和选择权的前提下，自愿同意个人数据或 AI 功能的使用。
algorithmic-bias: 算法输出因数据、目标或设计选择而对特定群体产生系统性不利差异的现象。
fairness: 评估并减少 AI 系统对不同个人或群体产生不合理差异影响的目标与方法。
compute: 完成模型训练或推理所需计算资源与处理能力的总称，常受芯片、内存和能耗限制。
gpu: 擅长并行数值计算的处理器，广泛用于神经网络训练和高吞吐推理。
cpu: 负责通用程序控制和串行计算的处理器，在 AI 系统中承担数据处理、调度和部分推理任务。
tpu: 为张量运算和机器学习工作负载设计的专用处理器，用于提高训练或推理效率。
npu: 面向神经网络计算优化的专用处理器，常见于端侧设备和专用 AI 加速平台。
ai-accelerator: 针对矩阵运算、张量处理等 AI 工作负载优化的专用硬件统称。
memory-bandwidth: 处理器与内存之间单位时间可传输的数据量，常成为大模型计算速度的重要限制。
high-bandwidth-memory: 通过高密度封装提供大带宽的内存技术，常与高性能 AI 加速器配合使用。
flops: 衡量计算设备每秒可完成多少浮点运算的指标，不能单独代表真实模型性能。
parameter-count: 模型中可学习参数的数量，用于描述规模但不能直接等同于能力或质量。
search-algorithm: 在可能状态或候选方案中按规则探索并找到目标路径的方法，是早期人工智能求解问题的重要基础。
reasoning-system: 根据事实、规则或概率关系推导结论的计算系统，用于把已有知识转化为可执行判断。
heuristic: 利用经验规则缩小搜索范围、较快找到可用答案的方法，通常不保证得到理论上的最优解。
perception: 让机器从图像、声音、传感器或其他输入中识别对象与环境状态的能力。
natural-language-processing: 让计算机分析、理解、生成和转换人类语言的技术领域，覆盖文本与部分语音任务。
computer-vision-field: 研究机器如何从图像和视频中提取信息并完成识别、理解或决策的人工智能分支。
speech-technology: 围绕语音识别、理解、合成和交互建立的技术集合，使机器能够处理口语信息。
robotics: 研究机器人如何感知环境、规划动作并执行物理任务的交叉领域，常结合控制与人工智能。
cognitive-computing: 借鉴人类认知过程来设计辅助理解、推理和决策系统的一类技术与产品表述。
ai-effect: 当一项人工智能能力变得普及时，人们不再把它视为真正智能的认知与命名现象。
clustering: 根据样本之间的相似性自动形成分组的无监督学习任务，用于发现数据中未知结构。
gradient-descent: 根据损失函数梯度反复调整模型参数、逐步降低误差的基础优化方法。
backpropagation: 从输出误差向网络前层传播梯度，以计算各参数应如何调整的神经网络训练算法。
overfitting: 模型过度记住训练数据细节，导致训练表现很好但面对新数据时表现下降的现象。
underfitting: 模型能力、特征或训练不足，无法学到数据中的主要规律，训练和测试表现都较差的现象。
generalization: 模型把训练中学到的规律有效应用到未见样本和相近场景的能力。
loss-function: 衡量模型预测与目标结果之间差异的函数，为训练优化提供需要降低的数值目标。
optimizer: 根据梯度和更新规则调整模型参数的算法，不同优化器在速度、稳定性和资源消耗上有所取舍。
epoch: 模型完整遍历一次训练数据集的训练单位，多个轮次会反复使用同一批数据更新参数。
batch-size: 一次参数更新同时处理的训练样本数量，会影响显存占用、梯度稳定性和训练速度。
instruction-tuning: 使用指令与期望回答数据继续训练模型，使其更能理解任务描述并按要求输出。
fine-tuning: 在已有模型基础上用特定数据继续训练，以适配领域、任务或行为目标的方法。
parameter-efficient-fine-tuning: 只训练少量新增或选定参数来适配大模型的方法，可减少计算、存储和版本维护成本。
lora: 通过训练低秩矩阵近似权重变化的参数高效微调方法，使模型适配时无需更新全部原始参数。
inference: 使用训练完成的模型处理新输入并生成预测或内容的过程，是用户实际调用模型的阶段。
decoding: 根据模型输出的 Token 概率选择后续序列的过程，决定结果的确定性、多样性和重复程度。
temperature: 调整生成概率分布平滑程度的参数，较低值通常更稳定，较高值通常增加多样性。
top-p: 每一步只从累计概率达到阈值的候选 Token 中采样的生成策略，也称核采样。
sampling: 按模型给出的概率分布选择下一个 Token 的生成方式，使同一输入可能得到不同结果。
quantization: 用更低数值精度表示模型权重或计算，以减少内存和算力消耗，同时可能带来质量损失。
structured-output: 要求模型按照 JSON、字段约束或其他机器可解析结构返回结果的输出方式。
role-prompting: 在提示中设定角色、职责或视角来限定回答重点的方式，不能替代事实依据与任务约束。
prompt-chaining: 把复杂任务拆成多个相互衔接的提示步骤，使中间结果可以检查、转换或交给下一步。
retrieval-context: 从外部资料检索后提供给模型的上下文片段，用于补充当前任务所需的事实与证据。
conversation-context: 当前对话中的历史消息、状态和约束集合，决定模型能够参考哪些先前信息。
context-compression: 在保留任务关键信息的同时压缩或摘要上下文，以降低 Token 占用并延长有效工作范围。
long-context: 模型一次能够处理较长输入与历史信息的能力，容量增加不代表所有位置都能同等有效利用。
prompt-evaluation: 使用固定任务、样本和标准比较提示词版本效果的过程，避免只凭少量主观示例判断。
prompt-versioning: 对提示词内容、变量、模型配置和评测结果进行版本记录，使变更可以追踪和回退。
instruction-hierarchy: 系统、开发者、用户与工具信息之间的指令优先顺序，用于处理冲突和行为边界。
text-to-speech: 将文字内容转换为可播放语音的任务，可控制语言、说话风格、速度和音色等属性。
speech-synthesis: 通过规则或生成模型合成人类语音波形的技术，是文本转语音和语音创作的基础。
audio-understanding: 从声音中识别语音、事件、音乐或环境信息，并形成可供任务使用的语义表示。
video-generation: 根据文本、图像或视频条件合成连续画面的生成任务，需要同时维持视觉质量和时间一致性。
video-understanding: 从视频的画面、声音和时间变化中识别事件、对象关系与叙事内容的能力。
multimodal-embedding: 把不同模态内容映射到可比较的向量空间，使文本、图像或音频之间能够计算语义关联。
cross-modal-retrieval: 使用一种模态的查询寻找另一种模态内容的检索任务，例如用文字搜索图片或视频。
visual-question-answering: 根据图像内容和自然语言问题生成回答的任务，需要结合视觉识别与语言推理。
image-captioning: 自动为图像生成文字描述的任务，应区分可见事实、推断内容和不确定信息。
document-understanding: 综合文档的文字、版面、表格和视觉元素提取结构与语义的多模态处理任务。
semantic-search: 根据查询与内容的语义相近程度进行检索，即使双方没有使用相同关键词也可能匹配。
hybrid-search: 组合关键词、向量和结构化过滤等多种检索信号，以兼顾精确匹配与语义召回。
sparse-vector: 大部分维度为零的向量表示，常用于表达词项权重并支持高效关键词检索。
dense-vector: 大多数维度都有数值的向量表示，常用于编码内容的语义或特征信息。
similarity-search: 根据距离或相似度从向量集合中寻找最接近查询表示的候选内容。
vector-index: 为高维向量建立的数据结构，用于减少相似度查询时需要比较的候选数量。
approximate-nearest-neighbor: 用可控精度损失换取更快速度和更低资源消耗的近似最近邻搜索方法。
top-k: 从检索结果中保留得分最高的 K 个候选的操作，K 值影响召回、噪声和后续处理成本。
query-rewriting: 根据用户意图把原始查询改写为更适合检索系统处理的表达，以提高召回和精确度。
query-expansion: 为查询补充同义词、相关概念或上下位词，扩大检索覆盖范围但也可能引入噪声。
agent-planning: Agent 根据目标、约束和当前状态选择后续步骤及工具的过程，需要支持更新和停止。
task-decomposition: 把复杂目标拆成范围明确、可执行和可检查的子任务，以降低一次处理的认知与执行负担。
reflection: Agent 对中间结果和执行轨迹进行再检查并决定是否修正的机制，不能保证自动发现所有错误。
self-correction: 系统依据反馈、验证结果或规则修改先前输出与行动的能力，需要明确触发条件和终止规则。
agent-memory: Agent 为跨步骤或跨会话任务保存并取回相关状态、经验与用户信息的机制。
short-term-memory: 在当前任务或会话范围内保存临时信息的记忆形式，通常随任务结束而清理。
long-term-memory: 跨会话持久保存可复用信息的记忆形式，需要处理隐私、过期、冲突和检索准确性。
state-management: 记录并更新任务进度、工具结果和控制变量，使多步骤流程能够恢复和继续的机制。
agent-orchestration: 协调模型、工具、子任务和检查点执行顺序的系统能力，用于管理复杂 Agent 工作流。
multi-agent-system: 由多个具有不同角色或能力的 Agent 协作完成任务的系统，需要处理通信、冲突和总体控制。
user-control: 让用户能够发起、调整、暂停、撤销或拒绝 AI 行为的产品能力，是可靠人机协作的基础。
undo-action: 将系统恢复到操作前状态的机制，可降低 AI 自动执行错误带来的不可逆影响。
fallback-experience: 当模型、网络或依赖能力不可用时提供简化功能、人工路径或明确说明的产品体验。
human-escalation: 在系统不确定、失败或风险升高时，把任务和必要上下文交给具备权限的人员处理。
feedback-loop: 收集用户修正、结果表现和运行信号并用于后续改进的闭环过程，需要控制偏差和数据质量。
prompt-interface: 让用户通过自然语言表达任务并查看、调整输入上下文的交互界面。
conversational-ui: 以连续对话作为主要交互方式的界面，适合渐进澄清但需要管理历史、状态和可发现性。
generative-ui: 根据任务和上下文动态生成界面内容或控件的交互方式，需要保持一致性、可控性和可访问性。
latency-budget: 产品为一次 AI 交互分配的最大可接受等待时间，用于约束模型、工具和后处理方案。
perceived-latency: 用户主观感受到的等待时长，可通过流式反馈、进度状态和分步呈现改善。
pairwise-comparison: 让评审者或模型在两个候选结果中选择较优者的评估方式，通常比独立打分更容易保持一致。
evaluation-rubric: 把质量目标拆成具体维度、等级和判断标准的评估说明，用于提高人工或模型评审一致性。
groundedness: 输出中的主张能否由给定上下文或证据支持的质量维度，常用于评估 RAG 回答。
factuality: 输出内容与可验证事实是否一致的质量维度，需要区分事实错误、过时信息和无证据推断。
relevance: 输出或检索结果与当前问题、意图和约束的相关程度。
answer-correctness: 回答是否给出符合参考事实和任务要求的结论，可能同时依赖内容与推理过程。
retrieval-recall: 相关资料中有多少被检索系统成功召回的指标，用于观察是否漏掉必要证据。
retrieval-precision: 检索结果中有多少确实与查询相关的指标，用于观察无关候选和上下文噪声。
faithfulness: 生成回答是否忠实使用给定资料且没有添加资料无法支持主张的质量维度。
toxicity-evaluation: 检查输出是否包含攻击、仇恨、骚扰或其他有害表达的评估任务，需要结合语言和场景。
rate-limiting: 限制用户或服务在一定时间内请求数量的机制，用于保护容量、成本和公平使用。
load-balancing: 把请求分配到多个服务实例或资源上的机制，以提高吞吐、可用性和故障恢复能力。
autoscaling: 根据负载和资源指标自动增加或减少服务实例的能力，需要兼顾响应速度与成本波动。
latency-optimization: 通过模型、缓存、批处理、网络和交互策略降低端到端响应时间的工程实践。
cost-optimization: 在满足质量与可靠性要求的前提下降低模型调用、计算、存储和运维成本的实践。
fallback-model: 当主模型不可用、超时或不适合当前任务时接管请求的备用模型。
model-routing: 根据任务类型、质量要求、延迟和成本把请求分配给不同模型或推理配置的机制。
prompt-cache: 复用模型对相同提示前缀的计算结果，以降低重复输入的延迟和推理成本。
semantic-cache: 根据查询语义相似度复用已有结果的缓存方式，需要控制错误命中和内容过期风险。
model-registry: 记录模型版本、来源、状态和部署信息的系统，为发布、追踪和回滚提供统一目录。
transparency: 向相关人员说明 AI 系统用途、能力、限制和重要决策方式的治理原则。
explainable-ai: 研究和提供模型预测依据、影响因素或可理解近似解释的方法与系统能力。
accountability: 明确谁对 AI 系统的设计、部署、使用和影响承担责任并接受追责的治理要求。
auditability: 通过记录数据、版本、决策和操作证据，使 AI 系统能够被独立检查与复盘的能力。
human-oversight: 由具备权限和信息的人监督、干预或停止 AI 系统运行的控制安排。
red-teaming: 以对抗视角主动寻找 AI 系统滥用路径、脆弱性和危险输出的测试实践。
adversarial-testing: 使用刻意构造的输入和攻击场景评估模型或系统在异常条件下的稳健性。
prompt-injection: 恶意或不可信内容试图覆盖原有指令、诱导模型泄露信息或执行越权操作的攻击。
jailbreak: 通过特殊提示绕过模型安全限制并诱导其产生受限内容或行为的攻击方式。
data-poisoning: 向训练、微调或检索数据中注入恶意样本，以操纵模型行为或降低系统质量的攻击。
training-compute: 模型训练过程中用于前向计算、反向传播和参数更新的计算资源总量。
inference-compute: 模型处理输入并生成输出时消耗的计算资源，会影响延迟、吞吐和服务成本。
data-center: 集中部署计算、存储、网络和供电设施的场所，是大规模 AI 训练与服务的重要基础设施。
cloud-computing: 通过网络按需提供计算、存储和平台资源的服务模式，使 AI 系统能够弹性部署。
edge-ai: 在靠近数据产生位置的边缘设备或节点运行 AI，以降低延迟、带宽和数据外传需求。
on-device-ai: 直接在手机、电脑或嵌入式设备上运行模型的方式，可提升隐私与离线能力但受资源限制。
semiconductor: 导电能力可控制的材料及其器件技术，是处理器、存储器和 AI 芯片的产业基础。
chip-fabrication: 通过光刻、沉积、刻蚀等工艺在晶圆上制造集成电路的生产过程。
foundry: 受托为芯片设计企业制造晶圆的专业生产模式，是半导体产业分工的重要环节。
advanced-packaging: 通过芯粒、堆叠和高密度互连等封装技术提升芯片系统带宽、集成度和能效的方法。
