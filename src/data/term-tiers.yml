# A/B/C 档位表 —— 内容质量门禁分级生效的依据（《迭代开发说明书》第十三节）。
#
# 由 pnpm build:term-tiers 依据机器预判信号生成：命中 ≥3 个正向信号 → A，
# 1–2 个 → B，0 个 → C。反向信号（同域名称包含，即近义碎片）记在 signals 里但
# 不计分，只作人工复核时的提示。
#
# 人工终判请把 reviewed 改成 true，此后本脚本不再改动该条的 tier ——
# 机器负责把 325 条压到需要人工看的规模，不负责替人拍板。
#
# 当前分布：A 42 / B 135 / C 150（共 327 条）。
#
# I6-03（2026-09-21）后 C 档的含义变了：150 条 C 档已全部标 status: deprecated，
# 不再作为独立入口出现。这里保留它的档位而不是删掉整段，是因为档位表还是
# 「哪些词条必须合规」的依据——一条词条若日后被恢复成独立入口，要先把它
# 从 C 提到 B 并补齐 B 档该有的内容，而不是直接改 status。
# 两个例外：compute / machine-learning 是领域根锚点，已上调为 B（见各自 note）。
