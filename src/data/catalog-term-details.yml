# 目录词条的手工内容覆盖层 —— 只放「计划表产不出来」的字段。
#
# 为什么需要这个文件（而不是直接改词条的 .mdx）：
#   scripts/sync-catalog.ts 会按 catalog-plan.yml 整体重写目录词条的 frontmatter。
#   凡是计划表产不出的字段，写在那些 .mdx 里都会在下一次 `pnpm generate:data` 时被静默抹掉，
#   而且 CI 不会报错（重写后的文件仍然是合法的）。2026-09-19 实测：30 条 chain 字段被抹。
#
# 规则（每条词条只有一个权威位置，判定入口是 src/lib/content/authorship.ts 的 protectedTermIds）：
#   · 手写词条（deep-content 批次 / hand-written-terms.yml）→ 字段写在 .mdx 的 frontmatter 里；
#   · 目录词条（由计划表生成）                             → 字段写在这里，由生成器写进文件。
#
#   判断某条属于哪一边：`pnpm explain:authorship <id…>`（不带参数则列出手写词条清单）。
#   写错位置的后果是不对称的：写进 .mdx 会被静默抹掉，写进这里则**完全无效**——
#   因为受保护的词条不会经过 buildPublishedCatalogTerms，覆盖层根本读不到它。
#   2026-09-21 实测：把 tool-use 的 boundaries 写在这里，generate:data 后正文仍是 8 段，
#   而 validate:data 全绿（schema 不要求 boundaries 必须存在）。
#
# 这里装 chain / chainRole / boundaries / minAction。
# 字段含义见 src/lib/content/schema.ts 的 termSchema。
#
# boundaries.confusions 会**同时**进正文的第 4 段「必须澄清的误会」（见
# scripts/lib/catalog-generation.ts 的 buildVerifiedBody）：只写 frontmatter 而不落正文，
# 词条就会同时出现两种坏状态——门禁 5 报缺段落，读者也永远看不到那句差别。
#
# 每站的站点定义（名称 / 提问 / 目标 / 动作 / coreTerms）在 src/data/chain.yml。

# ---- 第 1 站 · 地基 · 模型是什么 ------------------------------------------
next-token-prediction:
  chain: 1
  chainRole: advanced

# ---- 第 2 站 · 沟通 · 怎么把需求说清楚 ------------------------------------
# prompt / system-prompt / few-shot-prompting / context-engineering 这四条属深度内容批次，
# 字段写在各自的 .mdx 里（I6-02 批次 1 补的 boundaries / minAction 也在那里）。
zero-shot-prompting:
  chain: 2
  chainRole: advanced

# ---- 第 3 站 · 给知识 · 怎么让它知道你家的资料 ------------------------------
knowledge-base:
  chain: 3
  chainRole: intro
hybrid-search:
  chain: 3
  chainRole: advanced
query-rewriting:
  chain: 3
  chainRole: advanced
document-parsing:
  chain: 3
  chainRole: advanced

# ---- 第 4 站 · 给手脚 · 怎么让它做事 --------------------------------------
