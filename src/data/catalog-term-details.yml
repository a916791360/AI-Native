  chainRole: intro
# ai-agent 属深度内容批次；tool-use / agent-planning / agent-memory 已于 2026-09-21
# 重写为决策页并登记进 hand-written-terms.yml，字段写在各自的 .mdx 里。

# ---- 第 5 站 · 给接口 · 怎么标准化地接系统 ----------------------------------
