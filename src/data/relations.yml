- id: ai-precedes-generative-ai
  source: artificial-intelligence
  target: generative-ai
  type: prerequisite
  explanation: 先理解人工智能的整体范围，才能判断生成式 AI 在其中解决的是哪一类问题。

- id: generative-ai-precedes-llm
  source: generative-ai
  target: large-language-model
  type: prerequisite
  explanation: 大语言模型是生成式 AI 的重要分支，先理解生成任务有助于把握模型目标。

- id: token-precedes-context-window
  source: token
  target: context-window
  type: prerequisite
  explanation: 上下文窗口通常按 Token 数量计量，因此理解 Token 是判断容量与成本的前提。

- id: llm-precedes-hallucination
  source: large-language-model
  target: hallucination
  type: prerequisite
  explanation: 先理解语言模型如何预测下一个 Token，才能理解它为何会生成流畅但错误的内容。

- id: embedding-precedes-vector-database
  source: embedding
  target: vector-database
  type: prerequisite
  explanation: 向量数据库存储和检索嵌入向量，先理解 Embedding 才能理解相似度搜索。

- id: chunking-precedes-rag
  source: document-chunking
  target: retrieval-augmented-generation
  type: prerequisite
  explanation: 文档切片决定可被检索的知识单元，是理解 RAG 检索质量的重要前提。

- id: context-window-precedes-rag
  source: context-window
  target: retrieval-augmented-generation
  type: prerequisite
  explanation: RAG 需要把检索结果放入有限上下文，理解窗口限制才能判断取舍与成本。

- id: retrieval-precedes-rag
  source: retrieval
  target: retrieval-augmented-generation
  type: prerequisite
  explanation: 先理解检索如何找到相关资料，才能理解 RAG 如何为生成阶段提供上下文。

- id: token-component-of-llm
  source: token
  target: large-language-model
  type: component
  explanation: 大语言模型读取和生成的基本离散单位是 Token，它连接文本与模型内部计算。

- id: token-component-of-context-window
  source: token
  target: context-window
  type: component
  explanation: 上下文窗口的容量以 Token 数量表达，输入、输出和工具信息共同占用这段空间。

- id: llm-component-of-rag
  source: large-language-model
  target: retrieval-augmented-generation
  type: component
  explanation: RAG 在检索之后仍需要大语言模型根据问题与外部资料组织并生成最终回答。

- id: chunking-component-of-rag
  source: document-chunking
  target: retrieval-augmented-generation
  type: component
  explanation: 文档切片把长资料转成可索引和召回的单元，是 RAG 数据准备阶段的组成部分。

- id: retrieval-component-of-rag
  source: retrieval
  target: retrieval-augmented-generation
  type: component
  explanation: 检索负责从外部知识中找到候选资料，是 RAG 区别于纯模型生成的核心组成部分。

- id: vector-database-component-of-retrieval
  source: vector-database
  target: retrieval
  type: component
  explanation: 向量数据库可作为语义检索的存储与查询组件，但检索系统也可以使用其他索引方式。

- id: reranking-component-of-retrieval
  source: reranking
  target: retrieval
  type: component
  explanation: 重排对初次召回的候选结果再次评分，帮助更相关的资料进入最终上下文。

- id: ai-compared-with-generative-ai
  source: artificial-intelligence
  target: generative-ai
  type: comparison
  explanation: 人工智能是更广泛的领域，生成式 AI 专注于根据已有模式产生新的内容或表示。

- id: hallucination-compared-with-rag
  source: hallucination
  target: retrieval-augmented-generation
  type: comparison
  explanation: 幻觉描述生成结果可能失真，RAG 是降低部分知识性错误风险的方法而不是彻底消除机制。

- id: reranking-compared-with-retrieval
  source: reranking
  target: retrieval
  type: comparison
  explanation: 检索先扩大范围找到候选资料，重排再以更精细的标准调整这些候选的顺序。

- id: embedding-applied-to-retrieval
  source: embedding
  target: retrieval
  type: application
  explanation: 检索系统可以用嵌入向量表示语义，并通过相似度找到表达不同但含义接近的资料。

- id: llm-applied-to-rag
  source: large-language-model
  target: retrieval-augmented-generation
  type: application
  explanation: RAG 把大语言模型的生成能力用于整合检索证据，使回答能够利用模型参数之外的知识。

- id: agent-skills-compared-with-prompt-template
  source: agent-skills
  target: prompt-template
  type: comparison
  explanation: 两者都在沉淀反复交代的做法，但提示词模板是单点复用的一段文本，Agent 技能是带元数据、按需加载的文件夹。

- id: langchain-compared-with-model-context-protocol
  source: langchain
  target: model-context-protocol
  type: comparison
  explanation: LangChain 是跑在进程内的编排代码库，MCP 是跨进程的工具接入约定；两者不同层，可以叠加而不是替代。

- id: agent-skills-applied-to-ai-agent
  source: agent-skills
  target: ai-agent
  type: application
  explanation: Agent 技能为 Agent 提供可复用的做法，让同一套流程在不同会话与不同 Agent 之间保持一致。

- id: langchain-applied-to-ai-agent
  source: langchain
  target: ai-agent
  type: application
  explanation: LangChain 用来搭建 Agent 的运行时外壳，把模型、工具与提示循环封装成可复用的代码。

- id: fine-tuning-compared-with-rag
  source: fine-tuning
  target: retrieval-augmented-generation
  type: comparison
  explanation: 微调改模型权重、管行为与风格，RAG 改上下文、管可更新的知识；两者不同层，可以叠加而不是二选一。

- id: long-context-compared-with-rag
  source: long-context
  target: retrieval-augmented-generation
  type: comparison
  explanation: 长上下文提高单次可容纳的篇幅，RAG 决定该把哪些证据放进去；容量变大不替代「选对证据」这件事。

- id: generative-ai-precedes-multimodal-ai
  source: generative-ai
  target: multimodal-ai
  type: prerequisite
  explanation: 先理解生成式 AI 的共同机制，再看多模态系统如何把文字、图像、音频和视频放进同一任务。

- id: generative-ai-precedes-image-generation
  source: generative-ai
  target: image-generation
  type: prerequisite
  explanation: 图像生成是生成式 AI 在视觉内容上的具体任务，先理解生成概念才能判断产品能力边界。

- id: generative-ai-precedes-video-generation
  source: generative-ai
  target: video-generation
  type: prerequisite
  explanation: 视频生成沿用生成式 AI 的内容合成思路，但还需要处理画面连续性和时间维度。

- id: large-language-model-precedes-prompt
  source: large-language-model
  target: prompt
  type: prerequisite
  explanation: 明白模型是在当前上下文中预测输出，才能理解提示词为什么会改变结果而不是直接改模型。

- id: large-language-model-precedes-context-engineering
  source: large-language-model
  target: context-engineering
  type: prerequisite
  explanation: 上下文工程建立在模型依赖输入信息的事实之上，先理解模型工作方式再谈信息组织。

- id: context-window-precedes-long-context
  source: context-window
  target: long-context
  type: prerequisite
  explanation: 长上下文是上下文窗口能力的扩展，先知道窗口限制，才不会把容量数字误读成可靠性保证。

- id: prompt-precedes-structured-output
  source: prompt
  target: structured-output
  type: prerequisite
  explanation: 结构化输出仍然需要通过提示和约束表达目标格式，先掌握提示词再理解格式控制。

- id: context-engineering-precedes-rag
  source: context-engineering
  target: retrieval-augmented-generation
  type: prerequisite
  explanation: RAG 的关键不只是召回资料，还要把问题、证据和约束组织成模型能使用的上下文。

- id: document-parsing-component-of-rag
  source: document-parsing
  target: retrieval-augmented-generation
  type: component
  explanation: 文档解析把 PDF、表格和网页等原始材料转换为可处理内容，是知识接入的前置组成部分。

- id: knowledge-base-component-of-rag
  source: knowledge-base
  target: retrieval-augmented-generation
  type: component
  explanation: 知识库提供可被检索的外部资料，但它本身不负责生成答案或判断答案是否正确。

- id: embedding-component-of-rag
  source: embedding
  target: retrieval-augmented-generation
  type: component
  explanation: 嵌入把问题和资料转换成可比较的向量，帮助 RAG 通过语义相似度寻找候选证据。

- id: hybrid-search-component-of-retrieval
  source: hybrid-search
  target: retrieval
  type: component
  explanation: 混合检索把关键词匹配与语义相似度结合，适合同时保留专有名词精确性和语义召回能力。

- id: query-rewriting-component-of-retrieval
  source: query-rewriting
  target: retrieval
  type: component
  explanation: 查询改写先把用户的口语问题整理成更适合搜索的形式，再交给检索系统扩大命中机会。

- id: retrieval-recall-precedes-groundedness
  source: retrieval-recall
  target: groundedness
  type: prerequisite
  explanation: 如果相关证据根本没有被召回，回答就不可能稳定地建立在正确资料之上。

- id: retrieval-augmented-generation-precedes-groundedness
  source: retrieval-augmented-generation
  target: groundedness
  type: prerequisite
  explanation: 先理解 RAG 如何把外部证据放进生成上下文，才能判断回答是否真的依据了这些证据。

- id: retrieval-augmented-generation-precedes-evaluation
  source: retrieval-augmented-generation
  target: evaluation
  type: prerequisite
  explanation: 只有先明确系统的检索与生成链路，才知道应该用哪些样本评估答案质量和证据一致性。

- id: knowledge-base-compared-with-fine-tuning
  source: fine-tuning
  target: knowledge-base
  type: comparison
  explanation: 微调把规律写进模型参数，知识库把资料保留在外部并按需检索；更新成本和可追溯性不同。

- id: long-context-compared-with-fine-tuning
  source: fine-tuning
  target: long-context
  type: comparison
  explanation: 微调改变模型参数，长上下文改变一次输入能放多少内容；两者都不能自动保证答案准确。

- id: computer-vision-compared-with-image-generation
  source: computer-vision
  target: image-generation
  type: comparison
  explanation: 计算机视觉主要从图像中识别和理解信息，图像生成则根据条件合成新的视觉内容。

- id: image-generation-compared-with-video-generation
  source: image-generation
  target: video-generation
  type: comparison
  explanation: 图像生成输出单张或独立画面，视频生成还要维持跨帧的动作、人物和镜头连续性。

- id: multimodal-ai-applied-to-image-generation
  source: multimodal-ai
  target: image-generation
  type: application
  explanation: 多模态系统可以把文字、参考图和视觉理解结合起来，形成更丰富的图像生成输入。

- id: multimodal-ai-applied-to-video-generation
  source: multimodal-ai
  target: video-generation
  type: application
  explanation: 视频生成通常需要同时处理文字、图像与时间连续性，多模态能力为这些输入提供统一接口。

- id: large-language-model-compared-with-multimodal-ai
  source: large-language-model
  target: multimodal-ai
  type: comparison
  explanation: 大语言模型强调语言建模，多模态人工智能强调处理多种信息类型；一个系统可以同时具备两者。

- id: temperature-applied-to-generative-ai
  source: temperature
  target: generative-ai
  type: application
  explanation: 温度参数改变采样结果的随机程度，常用于控制生成式 AI 输出的稳定性与多样性。

- id: hallucination-compared-with-fine-tuning
  source: fine-tuning
  target: hallucination
  type: comparison
  explanation: 微调可能改善特定任务的行为，但它不是事实核验机制，不能把幻觉风险从根本上消除。

- id: ai-agent-precedes-tool-use
  source: ai-agent
  target: tool-use
  type: prerequisite
  explanation: 先理解 Agent 需要围绕目标循环行动，再看工具调用如何让模型获得读取和执行外部动作的能力。

- id: tool-use-component-of-ai-agent
  source: tool-use
  target: ai-agent
  type: component
  explanation: 工具调用是 Agent 与外部世界互动的关键组件，但单独的工具调用还不等于完整 Agent。

- id: agent-planning-component-of-ai-agent
  source: agent-planning
  target: ai-agent
  type: component
  explanation: Agent 规划负责把目标拆成后续步骤，是 Agent 从一次回答变成连续行动的重要组成部分。

- id: task-decomposition-component-of-agent-planning
  source: task-decomposition
  target: agent-planning
  type: component
  explanation: 任务拆解把复杂目标分成可执行的小步骤，为后续的 Agent 规划和检查提供结构。

- id: agent-memory-component-of-ai-agent
  source: agent-memory
  target: ai-agent
  type: component
  explanation: Agent 记忆保存任务所需的历史和状态，让系统能够跨步骤工作，但不等于模型永久记住一切。

- id: self-correction-applied-to-ai-agent
  source: self-correction
  target: ai-agent
  type: application
  explanation: 自我纠错让 Agent 根据中间结果发现问题并调整步骤，但仍需要明确停止条件和人工监督。

- id: human-in-the-loop-applied-to-ai-agent
  source: human-in-the-loop
  target: ai-agent
  type: application
  explanation: 人在回路为高风险动作保留确认、干预和停止位置，是 Agent 进入真实业务的重要控制方式。

- id: autonomous-agent-compared-with-ai-agent
  source: ai-agent
  target: autonomous-agent
  type: comparison
  explanation: AI Agent 是更宽泛的系统形态，自主智能体强调在较少人工干预下持续规划和执行。

- id: agent-planning-compared-with-workflow
  source: agent-planning
  target: workflow-automation
  type: comparison
  explanation: Agent 规划可以根据状态动态调整步骤，工作流自动化通常沿预先定义且可检查的路径执行。

- id: function-calling-component-of-tool-use
  source: function-calling
  target: tool-use
  type: component
  explanation: 函数调用提供结构化的工具请求格式，是应用实现工具调用的一种常见机制而不是全部能力。

- id: api-call-component-of-tool-use
  source: api-call
  target: tool-use
  type: component
  explanation: API 调用让模型或应用访问外部服务，是工具调用连接现实系统的常见执行方式。

- id: function-calling-compared-with-model-context-protocol
  source: function-calling
  target: model-context-protocol
  type: comparison
  explanation: 函数调用描述模型如何按结构提出一次函数请求，MCP 描述客户端与外部工具服务如何标准化连接。

- id: model-api-precedes-model-serving
  source: model-api
  target: model-serving
  type: prerequisite
  explanation: 先理解模型 API 如何暴露能力，再理解模型服务如何承担部署、并发和运行时管理。

- id: model-routing-applied-to-model-serving
  source: model-routing
  target: model-serving
  type: application
  explanation: 模型路由可以根据任务、成本、延迟或可用性选择不同模型，是服务层的调度能力。

- id: rate-limiting-component-of-model-serving
  source: rate-limiting
  target: model-serving
  type: component
  explanation: 限流保护模型服务免于被突发请求压垮，也是控制成本和保障多用户公平性的运行机制。

- id: model-context-protocol-applied-to-tool-use
  source: model-context-protocol
  target: tool-use
  type: application
  explanation: MCP 为工具和数据提供标准化接入方式，工具调用仍由客户端与模型应用共同完成执行。

- id: agent-skills-precedes-workflow-automation
  source: agent-skills
  target: workflow-automation
  type: prerequisite
  explanation: 把做法写清楚并沉淀下来，才能进一步判断哪些步骤适合由规则和工具稳定自动执行。

- id: agentic-workflow-component-of-workflow-automation
  source: agentic-workflow
  target: workflow-automation
  type: component
  explanation: Agent 工作流把模型的动态判断嵌入自动化流程，但仍需要明确边界、状态和失败处理。

- id: prompt-template-component-of-agent-skills
  source: prompt-template
  target: agent-skills
  type: component
  explanation: 提示词模板可以成为技能文件夹中的一个步骤，但完整 Skill 还需要触发条件、资料和输出约定。

- id: prompt-versioning-applied-to-agent-skills
  source: prompt-versioning
  target: agent-skills
  type: application
  explanation: 提示词版本管理帮助追踪技能中的指令变化，便于回溯改动与比较输出质量。

- id: prompt-chaining-component-of-agentic-workflow
  source: prompt-chaining
  target: agentic-workflow
  type: component
  explanation: 提示链把一个任务拆成多个有顺序的模型步骤，是 Agent 工作流中常见的固定编排方式。

- id: multi-agent-system-compared-with-workflow-automation
  source: multi-agent-system
  target: workflow-automation
  type: comparison
  explanation: 多智能体系统让多个角色协作完成任务，工作流自动化强调步骤和规则编排，二者可以组合使用。

- id: langchain-compared-with-agentic-workflow
  source: agentic-workflow
  target: langchain
  type: application
  explanation: LangChain 可以承载 Agent 工作流的提示、工具和状态编排，但工作流本身不依赖某一个框架。

- id: evaluation-precedes-observability
  source: evaluation
  target: observability
  type: prerequisite
  explanation: 先定义想判断的质量指标，再设计日志、追踪和运行指标，观测才不会变成无目的的数据堆积。

- id: benchmark-component-of-evaluation
  source: benchmark
  target: evaluation
  type: component
  explanation: 基准测试提供可重复的比较集合，是评估模型或应用效果时的一类固定测试工具。

- id: eval-set-component-of-evaluation
  source: eval-set
  target: evaluation
  type: component
  explanation: 评测集把真实任务整理成可反复运行的样本，是判断改动是否有效的基础材料。

- id: human-evaluation-component-of-evaluation
  source: human-evaluation
  target: evaluation
  type: component
  explanation: 人工评估补充自动指标难以覆盖的质量维度，例如表达清楚、符合语境和是否真正解决问题。

- id: llm-as-judge-compared-with-human-evaluation
  source: human-evaluation
  target: llm-as-judge
  type: comparison
  explanation: 人工评估依靠人的判断，大模型裁判用模型按标准打分；后者效率更高但仍需校准和抽查。

- id: groundedness-component-of-evaluation
  source: groundedness
  target: evaluation
  type: component
  explanation: 依据一致性检查答案是否被提供的证据支持，是知识问答和 RAG 应用的重要质量维度。

- id: observability-applied-to-ai-agent
  source: observability
  target: ai-agent
  type: application
  explanation: 可观测性记录 Agent 的步骤、工具调用和失败原因，帮助定位一次行动链到底在哪一环出错。

- id: retrieval-recall-applied-to-evaluation
  source: retrieval-recall
  target: evaluation
  type: application
  explanation: 检索召回率把知识库是否找到正确资料变成可测指标，能区分检索问题与生成问题。

- id: ai-agent-compared-with-large-language-model
  source: ai-agent
  target: large-language-model
  type: comparison
  explanation: 大语言模型主要生成内容，Agent 在模型之外增加规划、工具、状态和执行闭环。

- id: prompt-injection-precedes-ai-safety
  source: prompt-injection
  target: ai-safety
  type: prerequisite
  explanation: 先理解输入如何试图覆盖系统指令，才能看清 AI 应用为什么需要权限、隔离和人工干预。

- id: ai-guardrail-component-of-ai-safety
  source: ai-guardrail
  target: ai-safety
  type: component
  explanation: AI 护栏通过规则、分类器或流程限制高风险输入输出，是安全体系中的一层而非全部安全。

- id: human-oversight-component-of-ai-safety
  source: human-oversight
  target: ai-safety
  type: component
