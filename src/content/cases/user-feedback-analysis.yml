id: user-feedback-analysis
title: 每日用户反馈分析与产品改进
level: capstone
domain: AI 产品运营与用户洞察
audience:
  - 零基础或初级 AI 产品经理
  - 需要评审 AI 方案的产品与业务人员
businessContext: 这是一个教学案例。某数字产品团队从客服工单、应用商店评论和站内反馈接收中文用户反馈，产品团队希望形成可复核的问题证据和行动候选。
currentProcess:
  - 从多个来源导出反馈
  - 人工合并表格并处理重复项
  - 人工打标签和统计高频问题
  - 阅读代表反馈并编写简报
  - 产品经理复核并安排后续动作
objective: 在来源可追溯、错误可发现、人工可接管和成本可计算的前提下，缩短从反馈产生到可复核问题证据出现的时间。
baseline:
  - id: baseline-process-assumption
    kind: assumption
    evidence: E1
    statement: 当前人工流程用于建立教学起点，不代表真实组织一定使用表格或存在效率问题。
  - id: baseline-values-unknown
    kind: unknown
    evidence: E0
    statement: 实际反馈量、处理时间、覆盖、返工、成本和行动结果均需要真实组织数据验证。
constraints:
  - id: constraint-no-fabricated-values
    kind: fact
    evidence: E2
    statement: AI-Native 不为教学完整性虚构业务量、准确率、成本、收益或上线阈值。
  - id: constraint-human-publish
    kind: recommendation
    evidence: E1
    statement: 模型不得拥有最终发布、产品优先级、外发回复或问题关闭权限。
  - id: constraint-source-traceability
    kind: recommendation
    evidence: E3
    statement: 重要主题、疑似问题和行动草稿必须能够回到原始反馈证据和处理步骤。
status: draft
updatedAt: 2026-08-03

gates:
  - id: decide-ai-boundary
    order: 1
    stageId: model-boundaries
    status: draft
    title: 判断 AI 边界
    question: 哪些步骤真的需要概率语义能力？
    decision: 规则负责确定性任务，只在语义分类、近似重复和主题发现步骤引入受限模型。
    facts:
      - id: gate-one-deterministic-tasks
        kind: fact
        evidence: E1
        statement: 字段校验、精确去重、固定计数、状态和发布权限可以由确定性规则完成。
      - id: gate-one-semantic-variation
        kind: assumption
        evidence: E1
        statement: 用户表达存在语义变化，固定词表可能无法覆盖全部分类、近似重复和新主题。
    unknowns:
      - id: gate-one-rule-coverage
        kind: unknown
        evidence: E0
        statement: 现有标签规则的覆盖率、未知表达比例和各类误判成本尚未获得真实数据。
    options:
      - id: rules-first-workflow
        label: 规则优先的受限工作流
        assessment: recommended
        rationale: 把确定性步骤和概率步骤分开，才能分别控制质量、成本、权限与恢复。
        conditions:
          - 每一步都有固定输入输出和终止条件
          - 语义步骤可以单独评测并回退
        risks:
          - 规则和标签体系需要持续维护
        consequences:
          - 可以定位具体失败步骤
          - 不必要的模型调用被删除
        artifactDelta: 在 AI 适用性判断卡中标出规则、模型和人工的初步边界。
      - id: rules-only-system
        label: 全部使用固定规则
        assessment: conditional
        rationale: 对稳定词表和确定类别成本低且可复现，但可能漏掉表达变化和新主题。
        conditions:
          - 语义变化很少且规则覆盖经过验证
        risks:
          - 新表达和新问题可能被静默漏掉
        consequences:
          - 系统简单但发现能力受规则范围限制
        artifactDelta: 在判断卡中记录仅规则方案的适用条件和升级触发信号。
      - id: autonomous-agent-system
        label: 自主 Agent 完成并发布简报
        assessment: risky
        rationale: 当前步骤可以预定义，动态自主性没有被证明，却扩大了权限、终止和审计风险。
        conditions:
          - 只有动态工具选择被真实需求证明后才能重新评估
        risks:
          - 错误传播到真实发布动作
          - 难以判断哪一步引入错误
        consequences:
          - 当前阶段否决该方案
        artifactDelta: 在判断卡中记录暂不引入 Agent 及重新评估条件。
    artifactIds:
      - ai-applicability-card
    metricIds:
      - reviewed-feedback-coverage
      - unit-approved-brief-cost
    failureModeIds:
      - unnecessary-model-call
      - source-access-failure
    referenceIds:
      - term-ai-capability-boundary
      - term-workflow-automation
      - term-classification
      - source-openai-latency

  - id: establish-value-and-data
    order: 2
    stageId: opportunity-judgment
    status: draft
    title: 建立价值与数据条件
    question: 怎样证明这不是一个更漂亮的摘要 Demo？
    decision: 先记录现有处理、覆盖、返工、问题发现和行动链路，再定义可观察目标和数据许可。
    facts:
      - id: gate-two-output-use
        kind: assumption
        evidence: E1
        statement: 输出由产品运营、产品经理和客服或用户运营复核，并用于形成内部行动候选。
      - id: gate-two-value-principle
        kind: fact
        evidence: E2
        statement: 技术输出质量不等于业务价值，案例必须展示输出如何进入真实决策链路。
    unknowns:
      - id: gate-two-real-baseline
        kind: unknown
        evidence: E0
        statement: 实际来源、数据许可、标签一致性、处理基线和简报触发行动的方式仍待验证。
    options:
      - id: baseline-before-automation
        label: 先建立基线和使用链路
        assessment: recommended
        rationale: 没有当前流程和后续行动证据，就无法判断自动化是否解决了值得解决的问题。
        conditions:
          - 明确输出使用者和责任人
          - 获取合规的历史样本与当前流程记录
        risks:
          - 前期研究会推迟原型展示
        consequences:
          - 后续指标可以映射到真实任务
          - 数据限制会在开发前暴露
        artifactDelta: 在机会评估表中加入角色、当前流程、基线、数据权限和业务结果字段。
      - id: prototype-before-baseline
        label: 先做受控原型再补基线
        assessment: conditional
        rationale: 可用于确认数据结构和可行性，但原型结果不能被描述为业务价值已经成立。
        conditions:
          - 原型只处理授权样本
          - 不进入真实发布与优先级流程
        risks:
          - 团队可能把流畅输出误当作价值证据
        consequences:
          - 获得技术问题清单但不能得出上线结论
        artifactDelta: 在机会评估表中标记原型仅验证可行性，不代表业务机会成立。
      - id: summary-quality-as-value
        label: 用摘要流畅度证明价值
        assessment: risky
        rationale: 文本看起来专业并不证明覆盖提高、问题更早发现或行动质量改善。
        conditions:
          - 没有条件能够让文风单独成为业务价值证明
        risks:
          - 形成没有数据闭环的学生作品
        consequences:
          - 无法定义上线与复盘依据
        artifactDelta: 在机会评估表中记录否决原因并要求补齐业务链路。
    artifactIds:
      - opportunity-assessment
    metricIds:
      - reviewed-feedback-coverage
      - confirmed-issue-lead-time
      - human-review-time
    failureModeIds:
      - missing-required-fields
      - sensitive-data-exposure
    referenceIds:
      - route-ai-product-scenario
      - source-nist-core
      - term-problem-solution-fit
      - term-user-research
      - term-product-analytics

  - id: select-workflow
    order: 3
    stageId: solution-choice
    status: draft
    title: 拆解并选择工作流
    question: 如何让每一步可评估、可替换、可停止？
    decision: 采用固定工作流和结构化中间结果，分别处理接入、校验、去重、分类、聚类、摘要与人工复核。
    facts:
      - id: gate-three-step-contracts
        kind: recommendation
        evidence: E3
        statement: 多步工作流中的每个概率步骤都应有独立输入输出、日志和评测，而不是只看最终文本。
      - id: gate-three-fixed-process
        kind: assumption
        evidence: E1
        statement: 当前案例的主要步骤可以预定义，不需要模型动态决定全部工具和执行顺序。
    unknowns:
      - id: gate-three-task-shape
        kind: unknown
        evidence: E0
        statement: 标签是单标签还是多标签、主题更新频率和跨来源身份合并需求仍待真实数据确认。
    options:
      - id: observable-fixed-workflow
        label: 可观察的固定工作流
        assessment: recommended
        rationale: 固定步骤允许对失败、版本、成本和恢复进行独立治理，并保留必要语义能力。
        conditions:
          - 中间结果使用结构化契约
          - 每一步记录版本、状态和失败原因
        risks:
          - 步骤增多会增加编排和维护成本
        consequences:
          - 可以局部替换模型或退回人工流程
        artifactDelta: 在流程选择表中固定步骤、机制、输入、输出、状态、权限和终止条件。
      - id: single-model-call
        label: 单次模型调用完成全部分析
        assessment: conditional
        rationale: 在探索阶段可以快速验证输出形态，但不适合作为需要定位失败的生产架构。
        conditions:
          - 仅处理小型受控样本
          - 不把结果直接进入业务动作
        risks:
          - 分类、聚类和摘要错误相互混合
        consequences:
          - 原型简单但评测和恢复能力不足
        artifactDelta: 在流程选择表中注明单次调用仅作为探索基线。
      - id: dynamic-agent-orchestration
        label: 动态 Agent 自主编排工具
        assessment: risky
        rationale: 当前没有证据证明动态规划收益可以覆盖新增的权限、状态和终止复杂度。
        conditions:
          - 未来出现无法预定义的真实任务时重新评估
        risks:
          - 工具调用卡死或循环
          - 外部动作权限扩大
        consequences:
          - 当前方案不进入实现范围
        artifactDelta: 在流程选择表中记录 Agent 方案的否决证据和未来触发条件。
    artifactIds:
      - workflow-selection
    metricIds:
      - workflow-success-rate
      - p95-processing-latency
      - unit-approved-brief-cost
    failureModeIds:
      - model-timeout
      - version-regression
    referenceIds:
