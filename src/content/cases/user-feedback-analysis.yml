  - id: govern-launch-and-iteration
    order: 6
    stageId: capstone
    status: draft
    title: 治理上线与持续迭代
    question: 什么时候扩大范围，什么时候停止或回滚？
    decision: 按影子运行、辅助草稿、有限使用和扩大范围四级推进，每一级独立评审并保留回滚路径。
    facts:
      - id: gate-six-no-auto-promotion
        kind: recommendation
        evidence: E3
        statement: 流程跑通不能自动触发上线或扩围，必须重新检查预期用途、风险、质量、成本和人工控制。
      - id: gate-six-feedback-meaning
        kind: recommendation
        evidence: E3
        statement: 人工修改、驳回、业务偏好和真实错误必须分开记录，避免把所有反馈解释为同一种质量信号。
    unknowns:
      - id: gate-six-real-outcomes
        kind: unknown
        evidence: E0
        statement: 真实使用者行为、纠正数据代表性、行动结果和各级晋级门槛仍待试运行验证。
    options:
      - id: staged-launch
        label: 四级渐进上线
        assessment: recommended
        rationale: 先在不影响现行业务的影子模式发现错误，再按证据逐级增加可见性和范围。
        conditions:
          - 每一级有责任人、通过条件和回滚动作
          - 版本变化重新运行固定评测集
        risks:
          - 推进速度慢于直接上线
        consequences:
          - 风险影响被限制在明确范围
          - 可以按来源、类别或版本局部回退
        artifactDelta: 在完整评审档案中串联六份材料、四级上线、监控、停止和复盘责任。
      - id: direct-full-launch
        label: 完整流程直接替代人工
        assessment: risky
        rationale: 当前没有真实质量、人工容量、成本和恢复证据，直接替代会放大未知失败。
        conditions:
          - 当前没有满足直接全量替代的证据
        risks:
          - 无声漏报和错误建议进入产品决策
        consequences:
          - 当前阶段禁止该路径
        artifactDelta: 在完整评审档案中记录直接上线的缺失证据和否决理由。
      - id: permanent-shadow-mode
        label: 永久保持影子运行
        assessment: conditional
        rationale: 对高风险或价值不足场景可能合理，但如果永远不进入真实任务，也无法验证业务价值。
        conditions:
          - 风险或收益证据不支持更高权限
        risks:
          - 长期产生运行成本却不改善实际流程
        consequences:
          - 需要设定停止项目或重新定义目标的评审点
        artifactDelta: 在完整评审档案中加入停止项目而非默认扩围的选项。
    artifactIds:
      - complete-review
    metricIds:
      - confirmed-issue-lead-time
      - workflow-success-rate
      - review-queue-age
      - unit-approved-brief-cost
    failureModeIds:
      - source-access-failure
      - sensitive-data-exposure
      - review-queue-overload
      - correction-loop-bias
    referenceIds:
      - term-observability
      - term-rollback
      - term-ai-risk-management
      - term-canary-release
      - term-feedback-loop
      - term-trace
      - source-nist-core
      - source-pair-feedback

artifacts:
  - id: ai-applicability-card
    type: ai-applicability
    title: AI 适用性判断卡
    summary: 说明哪些任务使用规则、模型或人工，以及为什么当前不默认使用自主 Agent。
  - id: opportunity-assessment
    type: opportunity-assessment
    title: 场景机会评估表
    summary: 记录使用者、当前流程、业务结果、数据条件、基线和仍待验证的关键问题。
  - id: workflow-selection
    type: workflow-selection
    title: 任务流程与方案选择表
    summary: 展示每个步骤的输入、输出、状态、机制、权限、异常和终止条件。
  - id: responsibility-recovery
    type: responsibility-recovery
    title: 人机责任与失败恢复图
    summary: 明确错误信号、恢复动作、人工队列、升级上下文、责任人和撤销路径。
  - id: evaluation-guardrails
    type: evaluation-guardrails
    title: 评测、成本与上线护栏表
    summary: 汇总任务级评测、错误切片、单位成功任务成本、运行指标和待验证阈值。
  - id: complete-review
    type: complete-review
    title: 完整 AI 产品评审档案
    summary: 串联机会、方案、体验、质量、成本、上线分级、监控、回滚和下一轮验证。

metrics:
  - id: reviewed-feedback-coverage
    category: business
    label: 复核反馈覆盖
    definition: 被纳入人工可复核分析的授权反馈占全部目标反馈的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: confirmed-issue-lead-time
    category: business
    label: 确认问题发现周期
    definition: 从反馈产生到问题被授权人员确认并进入行动链路的端到端时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: classification-macro-f1
    category: quality
    label: 分类 Macro F1
    definition: 对每个标签分别计算 F1 后取平均，避免高频类别掩盖少数类别表现。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: high-impact-recall
    category: quality
    label: 高影响问题召回
    definition: 黄金集中实际高影响问题被系统候选发现的比例，重点观察假阴性。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: theme-evidence-coverage
    category: quality
    label: 主题证据覆盖
    definition: 已发布主题中能够回到充分原始反馈证据的主题比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: unsupported-claim-rate
    category: quality
    label: 无依据主张率
    definition: 摘要或行动草稿中无法由关联原始反馈支持的主张比例。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: workflow-success-rate
    category: operation
    label: 工作流成功率
    definition: 目标批次在证据完整且无需异常补偿的情况下进入人工复核的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: p95-processing-latency
    category: operation
    label: P95 处理延迟
    definition: 从授权记录进入系统到形成可复核候选的第九十五百分位端到端时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: human-review-time
    category: human
    label: 人工复核时间
    definition: 授权人员检查、修改、驳回和确认系统候选所需的实际处理时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: review-queue-age
    category: human
    label: 复核队列时长
    definition: 等待人工处理的项目从进入队列到获得决定的时间分布。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: unit-approved-brief-cost
    category: cost
    label: 单位已批准简报成本
    definition: 接入、模型、失败重试、运行和人工复核总成本除以证据完整的已批准简报数。
    desiredDirection: decrease
    thresholdStatus: baseline-needed

failureModes:
  - id: unnecessary-model-call
    title: 不必要的模型调用
    signal: 确定性任务仍产生模型请求和可变结果
    impact: 增加延迟、成本和不必要的不确定性
    recovery: 改为规则步骤并使用固定样本回归验证
    owner: 产品与工程
  - id: source-access-failure
    title: 来源接入失败
    signal: 来源批次缺口、错误码或队列持续积压
    impact: 简报覆盖不完整并可能形成错误趋势判断
    recovery: 重试或延迟批次，明确标记缺失来源并由工程确认补采
    owner: 工程
  - id: missing-required-fields
    title: 必要字段缺失
    signal: Schema 校验失败或来源字段映射发生变化
    impact: 记录被错配、丢失或错误进入后续分析
    recovery: 隔离记录并修复字段映射，不把无效输入发送给模型
    owner: 数据责任人
  - id: sensitive-data-exposure
    title: 敏感数据暴露
    signal: 脱敏检测、权限审查或人工复核发现不应处理的数据
    impact: 形成隐私、权限和组织风险
    recovery: 停止处理并隔离相关批次，按数据事件流程处置
    owner: 数据与安全责任人
  - id: duplicate-merge-error
    title: 重复合并错误
    signal: 人工驳回重复候选或频次出现异常变化
    impact: 原始证据被错误合并并造成主题频次失真
    recovery: 保留原文并撤销候选关系，重新校准相似度规则
    owner: 产品运营
  - id: taxonomy-drift
    title: 标签体系漂移
    signal: 标签分布异常、定义变化或固定回归集下降
    impact: 跨批次趋势不可比较并造成错误路由
    recovery: 回退标签版本并进入重标队列，由标签责任人批准新版
    owner: 标签责任人
  - id: high-impact-false-negative
    title: 高影响问题漏报
    signal: 后续人工、客服或线上事件发现系统遗漏的重要问题
    impact: 重大问题发现和处理被延迟
    recovery: 增加规则信号和高影响切片样本，复盘后重新评测
    owner: 产品与工程
  - id: unsupported-summary
    title: 无依据摘要或建议
    signal: 结论无法回到原始反馈或与证据冲突
    impact: 错误信息进入产品决策和行动链路
    recovery: 阻止发布并重新生成或由人工编写，保留失败样本
    owner: 产品经理
  - id: model-timeout
    title: 模型超时或不可用
    signal: 超时、错误率或重试量超过已批准运行边界
    impact: 批次延迟并增加失败与重试成本
    recovery: 跳过非必要步骤或回到人工流程，工程决定恢复条件
    owner: 工程
  - id: version-regression
    title: 版本质量回归
    signal: 提示、模型或配置变化后固定评测集下降
    impact: 质量无声漂移且历史结果不可比较
    recovery: 冻结或回退版本，阻止晋级并补充失败样本
    owner: 产品与工程
  - id: review-queue-overload
    title: 人工复核过载
    signal: 队列时长和未处理项目持续增长
    impact: 人在回路失去实际响应能力并形成业务死路
    recovery: 收紧自动化范围并按风险排序，由业务责任人调整容量
    owner: 业务责任人
  - id: correction-loop-bias
    title: 纠正反馈被错误解释
    signal: 自动指标改善但人工复盘和真实任务结果变差
    impact: 错误反馈进入评测集并放大系统偏差
    recovery: 区分修改、驳回、偏好和真实错误后重新校准标签
    owner: 评测责任人

