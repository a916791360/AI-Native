      - term-structured-output
      - term-workflow-automation
      - term-prompt-template
      - term-prompt-chaining
      - term-few-shot-prompting
      - source-openai-evals

  - id: design-control-and-recovery
    order: 4
    stageId: product-experience
    status: draft
    title: 设计控制与恢复
    question: 失败出现时谁能看见、纠正、接管和恢复？
    decision: 低确定性、高影响、冲突和无证据结果进入人工队列，原文与每一步结果始终保留。
    facts:
      - id: gate-four-human-authority
        kind: recommendation
        evidence: E3
        statement: 人工接管必须有明确责任人、必要上下文、真实权限和响应路径，不能只是界面上的按钮。
      - id: gate-four-reversible-data
        kind: recommendation
        evidence: E1
        statement: 近似重复和主题合并只保存候选关系，不删除原始反馈，确保纠正可以撤销。
    unknowns:
      - id: gate-four-review-capacity
        kind: unknown
        evidence: E0
        statement: 人工复核容量、响应时间、升级责任人和业务连续性要求尚未得到真实组织确认。
    options:
      - id: risk-based-review
        label: 基于风险的人工复核
        assessment: recommended
        rationale: 把有限人工能力用于高影响、冲突、低确定性和无证据结果，同时保留低风险自动处理。
        conditions:
          - 每个升级携带原文、原因和建议动作
          - 责任人拥有修改、驳回和停止权限
        risks:
          - 风险规则不当会造成队列过载或漏报
        consequences:
          - 自动化范围可以随证据逐步扩大
        artifactDelta: 在责任恢复图中加入人工队列、升级上下文、超时和撤销路径。
      - id: review-every-record
        label: 每条记录都由人工复核
        assessment: conditional
        rationale: 影子运行和早期校准阶段有价值，但长期可能把自动化变成额外工作。
        conditions:
          - 有明确的试运行期限和抽样退出标准
        risks:
          - 人工负担增加并形成审批疲劳
        consequences:
          - 获得高质量纠正样本但吞吐受限
        artifactDelta: 在责任恢复图中标注全量复核仅用于受控阶段。
      - id: publish-with-disclaimer
        label: 自动发布并附加免责声明
        assessment: risky
        rationale: 免责声明不能修复无依据建议，也不能替代发布权限和责任边界。
        conditions:
          - 不存在可接受的自动发布条件
        risks:
          - 错误建议进入真实决策
        consequences:
          - 当前阶段禁止该路径
        artifactDelta: 在责任恢复图中明确最终发布必须由授权人员确认。
    artifactIds:
      - responsibility-recovery
    metricIds:
      - human-review-time
      - review-queue-age
      - unsupported-claim-rate
    failureModeIds:
      - duplicate-merge-error
      - taxonomy-drift
