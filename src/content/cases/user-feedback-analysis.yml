  - id: define-evaluation-and-cost
    order: 5
    stageId: quality-constraints
    status: draft
    title: 定义评测、成本与护栏
    question: 怎样证明质量、时效和成本同时可接受？
    decision: 建立任务级黄金集、错误切片、线上运行指标和单位成功任务成本，具体阈值等待真实基线。
    facts:
      - id: gate-five-metric-selection
        kind: fact
        evidence: E3
        statement: 类别不平衡或错误成本不同时，总体准确率不能替代 precision、recall 和错误类型分析。
      - id: gate-five-total-cost
        kind: fact
        evidence: E2
        statement: 单位成功任务成本必须包含接入、模型、失败重试、运行和人工复核，而不只是调用价格。
    unknowns:
      - id: gate-five-thresholds
        kind: unknown
        evidence: E0
        statement: 各类错误成本、预算、时效、上线门槛和回滚阈值尚未通过真实基线确定。
    options:
      - id: task-specific-evaluation
        label: 分步任务评测与单位成本
        assessment: recommended
        rationale: 分别评测输入、去重、分类、主题、问题发现和摘要，才能知道优化是否改善真实任务。
        conditions:
          - 黄金集包含常见、边界和高影响少数类
          - 自动评分与人工判断持续校准
        risks:
          - 建立和维护评测集需要业务人员投入
        consequences:
          - 版本比较和上线决定有可复核证据
        artifactDelta: 在评测护栏表中加入分步指标、错误切片、成本公式和待验证阈值。
      - id: aggregate-accuracy-only
        label: 只用总体准确率验收
        assessment: risky
        rationale: 总体准确率会掩盖高影响少数类漏报，也无法评估摘要证据与主题质量。
        conditions:
          - 没有条件能让单一准确率覆盖完整工作流
        risks:
          - 严重长尾失败被平均值掩盖
        consequences:
          - 无法形成可靠上线门槛
        artifactDelta: 在评测护栏表中记录单指标方案的盲区和否决理由。
      - id: model-price-only
        label: 只比较模型单次价格
        assessment: conditional
        rationale: 单价可以用于初步筛选，但不能代表重试、人工、运行和失败后的总成本。
        conditions:
          - 只作为成本构成中的一个输入
        risks:
          - 便宜模型可能通过返工和失败增加总成本
        consequences:
          - 必须补充单位成功任务口径后才能决策
        artifactDelta: 在成本表中把模型单价降为总成本的一项，不作为最终结论。
    artifactIds:
      - evaluation-guardrails
    metricIds:
      - classification-macro-f1
