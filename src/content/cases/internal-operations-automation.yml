id: internal-operations-automation
title: 内部运营自动化助手
level: focus
domain: AI 产品与内部运营
audience:
  - 零基础或初级 AI 产品经理
  - 需要评审内部自动化助手的产品、运营与工程人员
businessContext: 这是一个教学案例。某运营团队每天重复执行数据录入、工单路由、报表汇总和状态更新等固定流程，希望用 AI 自动化，但担心错误动作被批量放大和越权执行。
currentProcess:
  - 识别需要处理的运营任务
  - 汇总相关数据并录入系统
  - 按规则路由或更新状态
  - 人工核对关键动作
  - 记录处理结果并生成报表
objective: 在动作可审计、错误可恢复、人工可接管的前提下，帮助运营团队自动化重复任务；首版只做信息处理与草稿，不自动执行有副作用的动作。
baseline:
  - id: io-baseline-process-assumption
    kind: assumption
    evidence: E1
    statement: 当前识别、录入、路由、核对和记录流程只用于建立教学起点，不代表真实运营团队采用同样工具或存在效率问题。
  - id: io-baseline-values-unknown
    kind: unknown
    evidence: E0
    statement: 实际错误率、返工率、恢复时间、人工容量、副作用范围与单位成本均需要真实组织数据验证。
constraints:
  - id: io-constraint-no-fabricated-thresholds
    kind: fact
    evidence: E2
    statement: AI-Native 不为教学完整性虚构错误率、恢复时间、成本、延迟或上线阈值。
  - id: io-constraint-human-action-authority
    kind: recommendation
    evidence: E1
    statement: 首版只做信息处理与草稿，不自动执行有副作用的动作，关键动作由确定性流程和运营确认。
  - id: io-constraint-untrusted-input
    kind: recommendation
    evidence: E3
    statement: 输入数据作为不可信数据处理，不能取得系统指令、工具或执行权限。
status: verified
updatedAt: 2026-08-13
verifiedAt: 2026-08-13

gates:
  - id: decide-ai-boundary
    order: 1
    stageId: model-boundaries
    status: verified
    title: 判断 AI 边界
    question: 内部运营需要 Agent，还是规则与受限步骤已经足够？
    decision: 用规则承担确定性流程，只在需要语义判断的步骤引入受限模型，执行动作保持人工或确定性系统。
    facts:
      - id: io-g1-automation-risk
        kind: fact
        evidence: E3
        statement: 自主执行步骤存在不可预测性与动作漂移风险，自动化流程需按风险分级治理。
      - id: io-g1-automation-not-agent
        kind: recommendation
        evidence: E1
        statement: 自动化不等于智能体；只有任务需要动态判断时才增加自主性，稳定流程优先用确定性系统。
      - id: io-g1-deterministic-controls
        kind: recommendation
        evidence: E1
        statement: 字段映射、路由规则、状态更新与执行权限应由确定性系统承担。
    unknowns:
      - id: io-g1-automation-need
        kind: unknown
        evidence: E0
        statement: 真实流程中多少可由规则完成、多少需要语义判断或生成，尚未通过任务样本验证。
    options:
      - id: governed-automation-copilot
        label: 治理优先的自动化辅助
        assessment: recommended
        rationale: 先固定规则与执行边界，再把语义判断限制为可复核草稿，能分开控制副作用和价值。
        conditions:
          - 流程步骤、字段与权限可维护
          - 动作可审计并同范围撤销
        risks:
          - 流程治理增加前期投入
        consequences:
          - 副作用可控制、错误可恢复
        artifactDelta: 在 AI 适用性卡中固定规则治理、语义草稿、人工决策与执行授权的责任边界。
      - id: rules-only-automation
        label: 规则自动化优先
        assessment: conditional
        rationale: 当流程稳定且字段结构化时，规则自动化更可预测，也可能已满足运营目标。
        conditions:
          - 流程可确定性描述
          - 无需要语义判断的步骤
        risks:
          - 语义变化场景覆盖不足
        consequences:
          - 系统简单且副作用可控
          - 语义任务继续由运营手工处理
        artifactDelta: 在 AI 适用性卡中记录仅规则方案的覆盖范围和升级到模型的触发条件。
      - id: autonomous-agent
        label: 全自主 Agent
        assessment: risky
        rationale: 全自主执行会把错误动作批量放大，模型无法承担有副作用动作的责任。
        conditions:
          - 当前没有支持全自主 Agent 的条件
        risks:
          - 批量错误动作不可控
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在 AI 适用性卡中记录否决全自主 Agent 的理由。
    artifactIds:
      - io-ai-applicability
    metricIds:
