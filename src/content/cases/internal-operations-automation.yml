artifacts:
  - id: io-ai-applicability
    type: ai-applicability
    title: AI 适用性与不可自动化边界卡
    summary: 区分规则治理、语义草稿、运营决策与执行授权，记录不使用生成和禁止自动化的范围。
  - id: io-opportunity-assessment
    type: opportunity-assessment
    title: 内部自动化机会评估表
    summary: 记录目标角色、当前任务、流程条件、真实基线、错误成本与升级链路。
  - id: io-workflow-selection
    type: workflow-selection
    title: 自动化工作流与方案选择表
    summary: 固定信息处理、草稿、决策与执行步骤及各自输入输出与终止条件。
  - id: io-responsibility-recovery
    type: responsibility-recovery
    title: 运营权限、升级与恢复图
    summary: 标明动作检查、预览、确认、撤销、转交与最终执行的人员和系统权限。
  - id: io-evaluation-guardrails
    type: evaluation-guardrails
    title: 自动化评测、成本与上线护栏表
    summary: 组合固定集、风险切片、分步质量、单位成功成本与回滚条件。
  - id: io-complete-review
    type: complete-review
    title: 完整内部自动化产品评审档案
    summary: 汇总六关决策、分级执行权限、监控、事件响应、晋级和回滚证据。

metrics:
  - id: io-task-automation-rate
    category: business
    label: 有依据自动化完成率
    definition: 有来源且经运营确认完成的自动化任务，占进入目标范围任务的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: io-rework-rate
    category: business
    label: 返工率
    definition: 自动化结果被运营驳回或需要返工的任务，占全部任务的比例。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-error-rate
    category: quality
    label: 错误动作率
    definition: 执行结果错误的动作占全部执行动作的比例。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-rule-coverage
    category: quality
    label: 规则覆盖
    definition: 可被确定性规则完整描述的流程占目标流程的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: io-audit-coverage
    category: operation
    label: 审计覆盖
    definition: 动作可回溯到输入、规则、模型与运营确认的完整程度。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: io-side-effect-count
    category: operation
    label: 越权或不可恢复副作用数
    definition: 未经授权执行、或产生不可恢复副作用的事件数量。
    desiredDirection: guardrail
    thresholdStatus: defined
    threshold: 任何越权执行或不可恢复副作用均阻止晋级并触发事件响应
  - id: io-recovery-time
    category: operation
    label: 错误恢复时间
    definition: 从发现错误动作到完成同范围撤销或回滚所需时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-draft-latency
    category: operation
    label: P95 草稿延迟
    definition: 从提交任务到返回可供运营复核草稿的第九十五百分位端到端时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-version-consistency
    category: operation
    label: 规则与字段版本一致性
    definition: 执行所用规则与字段映射版本与当前有效版本一致的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: io-human-review-time
    category: human
    label: 运营复核时间
    definition: 运营核对动作、预览、确认或撤销一次任务所投入的人工时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-escalation-age
    category: human
    label: 高风险升级队列时长
    definition: 高风险或批量动作从进入人工升级队列到由责任人接手的等待时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: io-unit-task-cost
    category: cost
    label: 单位已确认任务成本
    definition: 规则治理、模型、失败运行与人工复核总成本除以有依据且经运营确认的任务数。
    desiredDirection: decrease
    thresholdStatus: baseline-needed

failureModes:
  - id: io-fm-wrong-batch-action
    title: 批量错误动作
    signal: 批量更新中大量任务被错误处理
    impact: 错误被批量放大并产生广泛副作用
    recovery: 停止执行、同范围回滚并回放固定集定位原因
    owner: 运营和工程
  - id: io-fm-unauthorized-action
    title: 越权执行
    signal: 出现运营未确认或规则未授权的执行动作
    impact: 绕过人工授权造成副作用
    recovery: 停用执行、回滚权限并启动事件响应
    owner: 工程和运营主管
  - id: io-fm-side-effect-unrecoverable
    title: 副作用不可撤销
    signal: 动作产生无法回滚的外部副作用
    impact: 错误无法恢复并造成持续影响
    recovery: 阻断后续动作、评估影响并启动事件响应
    owner: 工程和运营主管
  - id: io-fm-prompt-injection
    title: 输入数据间接注入
    signal: 输入数据试图改变指令或请求执行动作
    impact: 模型行为可能被输入内容操纵
    recovery: 将输入数据按不可信数据隔离并阻止动作
    owner: 安全和工程
  - id: io-fm-stale-rule
    title: 过时规则
    signal: 执行使用旧版本规则或已失效字段映射
    impact: 任务被按错误规则处理
    recovery: 停止相关规则、更新版本并回放受影响任务
    owner: 运营和工程
  - id: io-fm-duplicate-execution
    title: 重复执行
    signal: 同一任务被多次执行
    impact: 产生重复副作用与数据污染
    recovery: 停止执行、检查去重规则并回放固定样本
    owner: 运营和工程
  - id: io-fm-silent-failure
    title: 静默失败
    signal: 任务失败但无日志或状态标记
    impact: 错误未被发现并持续积累
    recovery: 补齐失败标记与审计、回放受影响任务
    owner: 工程
  - id: io-fm-review-overload
    title: 运营复核队列过载
    signal: 复核时长、积压或未处理高风险任务上升
    impact: 形式上的人工确认无法提供真实保护
    recovery: 收紧自动化范围、按风险排序并调整容量
    owner: 运营主管
  - id: io-fm-model-timeout
    title: 模型服务超时
    signal: 草稿延迟、失败率或重试量升高
    impact: 运营等待增加且重复调用推高成本
    recovery: 停止重试、降级到规则与人工处理
    owner: 工程
  - id: io-fm-version-regression
    title: 版本升级质量回退
    signal: 固定集或风险切片指标相对稳定版本下降
    impact: 错误动作或副作用静默恶化
    recovery: 冻结候选版本并回滚到上一稳定组合
    owner: 产品、工程和评测负责人
  - id: io-fm-sensitive-leak
    title: 敏感信息泄露
    signal: 处理过程暴露无权访问的内部数据
    impact: 造成隐私与合规风险
    recovery: 阻断输出、保全日志并启动安全事件响应
    owner: 安全和工程
  - id: io-fm-scope-creep
    title: 自动化范围蔓延
    signal: 自动化逐步覆盖未经验证的新流程
    impact: 风险在无门禁的情况下累积
    recovery: 回到分级发布门禁并重新评估每个新增范围
    owner: 产品和运营主管

