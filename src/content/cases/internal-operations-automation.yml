  - id: establish-value-and-data
    order: 2
    stageId: opportunity-judgment
    status: verified
    title: 建立价值与数据条件
    question: 怎样证明解决的是「重复劳动」，而不是「上了自动化」？
    decision: 先记录重复劳动、错误和返工基线，再定义有依据且经运营确认的自动化结果。
    facts:
      - id: io-g2-value-not-automation
        kind: recommendation
        evidence: E1
        statement: 自动化本身不是价值，减少重复劳动和错误才是；上了 Agent 不等于解决业务问题。
      - id: io-g2-data-readiness
        kind: recommendation
        evidence: E3
        statement: 数据准备度由流程稳定性、字段质量和权限决定，不由任务量决定。
    unknowns:
      - id: io-g2-baseline-needed
        kind: unknown
        evidence: E0
        statement: 真实重复劳动时长、错误率、返工比例、人工容量与流程分布尚未验证。
    options:
      - id: measure-before-build
        label: 先测量再建设
        assessment: recommended
        rationale: 先建立重复劳动和错误基线，再定义有依据的自动化结果，避免把自动化当价值。
        conditions:
          - 能定义并统计重复劳动与错误
          - 流程与字段有质量边界
        risks:
          - 基线收集需要运营配合
        consequences:
          - 价值目标可验证而非凭感觉
        artifactDelta: 在机会评估表中记录目标角色、当前任务、流程条件、真实基线、错误成本与升级链路。
      - id: demo-driven-build
        label: 以演示效果立项
        assessment: risky
        rationale: 演示自动化顺畅不代表错误和返工被缓解，缺少基线会导致价值无法验证。
        conditions:
          - 当前没有支持仅凭演示立项的条件
        risks:
          - 把「跑通了」误当「跑对了」
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在机会评估表中记录否决演示驱动的理由。
    artifactIds:
      - io-opportunity-assessment
    metricIds:
      - io-rework-rate
      - io-error-rate
    failureModeIds:
      - io-fm-wrong-batch-action
    referenceIds:
