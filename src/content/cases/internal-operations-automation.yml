      - term-problem-solution-fit
      - term-north-star-metric
      - term-stakeholder-management
      - term-prioritization
      - term-roadmap
      - term-prd

  - id: select-workflow
    order: 3
    stageId: solution-choice
    status: verified
    title: 拆解信息处理、草稿与执行工作流
    question: 如何区分信息处理、建议、决策和外部动作？
    decision: 把信息处理、语义草稿、运营决策与动作执行拆成可观察步骤，执行动作由确定性系统或运营确认。
    facts:
      - id: io-g3-layer-separation
        kind: recommendation
        evidence: E1
        statement: 信息处理、建议、决策和执行应分层授权，有副作用的动作单独设置权限。
      - id: io-g3-untrusted-input
        kind: fact
        evidence: E3
        statement: 输入数据作为不可信数据处理，不能取得系统指令、工具或执行权限。
    unknowns:
      - id: io-g3-coverage
        kind: unknown
        evidence: E0
        statement: 不同流程下规则与语义判断的合理分工尚未通过任务样本验证。
    options:
      - id: layered-automation-pipeline
        label: 分层自动化流水线
        assessment: recommended
        rationale: 把信息处理、草稿、决策和执行分开，能单独控制每层的副作用和授权。
        conditions:
          - 各步骤输入输出与终止条件可定义
          - 执行动作由确定性系统执行
        risks:
          - 分层增加系统复杂度
        consequences:
          - 每层可独立评测与授权
        artifactDelta: 在方案选择表中固定信息处理、草稿、决策与执行步骤及各自输入输出。
      - id: single-prompt-automation
        label: 单次提示包办
        assessment: risky
        rationale: 一次提示同时处理、判断和执行，会让副作用无法分层控制。
        conditions:
          - 当前没有支持单次提示包办的条件
        risks:
          - 错误执行与越权混在一起
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在方案选择表中记录否决单次提示包办的理由。
    artifactIds:
      - io-workflow-selection
    metricIds:
