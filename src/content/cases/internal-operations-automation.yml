  - id: design-control-and-recovery
    order: 4
    stageId: product-experience
    status: verified
    title: 设计运营控制与失败恢复
    question: 运营怎样看见动作、预览影响、确认并撤销？
    decision: 展示动作与影响范围、允许预览与确认，批量动作支持同范围撤销，执行前强制运营确认。
    facts:
      - id: io-g4-preview-confirm
        kind: recommendation
        evidence: E1
        statement: AI 动作的影响范围越大，预览、确认和同范围撤销越重要。
      - id: io-g4-escalation
        kind: recommendation
        evidence: E3
        statement: 高风险或批量动作需要明确角色、信息与权限的升级路径，不能只靠形式上的确认。
    unknowns:
      - id: io-g4-review-burden
        kind: unknown
        evidence: E0
        statement: 运营复核动作、确认与撤销的实际时间与疲劳影响尚未验证。
    options:
      - id: visible-preview-confirm
        label: 可见、可预览、可撤销
        assessment: recommended
        rationale: 展示动作与影响、允许预览并支持同范围撤销，让运营在执行前真正理解并负责。
        conditions:
          - 动作可预览影响范围
          - 执行由运营显式确认
        risks:
          - 复核会增加运营时间
        consequences:
          - 减少批量错误与越权执行
        artifactDelta: 在权限与恢复图中标明动作检查、预览、确认、撤销与转交的人员权限。
      - id: auto-execute-with-undo
        label: 自动执行加撤销
        assessment: conditional
        rationale: 自动执行能减少操作，但只有错误可发现且能及时撤销时才可考虑，首版不采用。
        conditions:
          - 有实时执行日志与同范围撤销
          - 高风险动作不进入自动执行
        risks:
          - 撤销无法完全挽回已发生的副作用
        consequences:
          - 仅作为后续阶段的可评估选项
        artifactDelta: 在权限与恢复图中记录自动执行与撤销作为后续阶段的评估条件。
    artifactIds:
      - io-responsibility-recovery
    metricIds:
      - io-human-review-time
      - io-escalation-age
    failureModeIds:
      - io-fm-review-overload
      - io-fm-side-effect-unrecoverable
    referenceIds:
