  - id: define-evaluation-and-cost
    order: 5
    stageId: quality-constraints
    status: verified
    title: 定义评测、成本与上线护栏
    question: 怎样评测动作准确率、副作用与恢复能力？
    decision: 用版本化固定集和风险切片分步评测，用「有依据且经运营确认的任务」计算单位成功成本。
    facts:
      - id: io-g5-sliced-eval
        kind: recommendation
        evidence: E3
        statement: 评测分数只对既定样本、标准和运行配置有效，风险切片比总体准确率更能暴露批量错误。
      - id: io-g5-unit-cost
        kind: recommendation
        evidence: E1
        statement: 成本必须按「成功完成一次有依据任务」核算，不能把单次模型调用价格当总成本。
    unknowns:
      - id: io-g5-eval-baseline
        kind: unknown
        evidence: E0
        statement: 真实动作准确、副作用范围与恢复能力的基线尚未建立。
    options:
      - id: sliced-eval-and-unit-cost
        label: 分片评测与单位成本
        assessment: recommended
        rationale: 分步骤评测动作准确、副作用与恢复，并用有依据任务结果算成本，能定位问题并控成本。
        conditions:
          - 有版本化固定集与风险切片
          - 能追踪「经运营确认」作为成功口径
        risks:
          - 评测集建设需要投入
        consequences:
          - 质量可比较、成本可核算
        artifactDelta: 在评测与护栏表中组合固定集、风险切片、分步质量、单位成本与回滚条件。
      - id: overall-accuracy-only
        label: 只看总体准确率
        assessment: risky
        rationale: 总体准确率会掩盖高风险动作的批量错误与副作用。
        conditions:
          - 当前没有支持只看总体准确率的条件
        risks:
          - 批量错误被平均掩盖
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在评测与护栏表中记录否决只看总体准确率的理由。
    artifactIds:
      - io-evaluation-guardrails
    metricIds:
      - io-version-consistency
      - io-recovery-time
      - io-draft-latency
    failureModeIds:
      - io-fm-version-regression
