      - term-rate-limiting

  - id: govern-launch-and-iteration
    order: 6
    stageId: capstone
    status: verified
    title: 治理发布与持续更新
    question: 什么时候能扩大自动化，错误或回退时如何停止？
    decision: 按影子草稿、辅助草稿、受限自动草稿逐级推进，自动执行不进入首版。
    facts:
      - id: io-g6-staged-release
        kind: recommendation
        evidence: E3
        statement: 上线应按影响范围逐级推进，每级需要独立通过条件和回滚路径。
      - id: io-g6-guardrail
        kind: fact
        evidence: E2
        statement: 任何越权执行或不可恢复的副作用必须阻止晋级并触发事件响应，作为明确发布护栏。
    unknowns:
      - id: io-g6-adoption-evidence
        kind: unknown
        evidence: E0
        statement: 各阶段真实自动化率改善、错误率与运营采纳尚未验证。
    options:
      - id: staged-shadow-to-draft
        label: 影子到草稿逐级推进
        assessment: recommended
        rationale: 先影子运行、再辅助草稿、后受限自动草稿，每级用独立通过条件换取更高自动化。
        conditions:
          - 每级有通过条件与回滚路径
          - 自动执行不进入首版
        risks:
          - 逐级推进需要更长时间
        consequences:
          - 风险与自动化程度同步增长
        artifactDelta: 在完整评审档案中汇总六关决策、分级执行权限、监控、事件响应与回滚证据。
      - id: direct-full-automation
        label: 直接全量自动化
        assessment: risky
        rationale: 未经验证直接全量自动化，会把批量错误与副作用一次性放大。
        conditions:
          - 当前没有支持直接全量自动化的条件
        risks:
          - 批量错误动作不可控
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在完整评审档案中记录否决直接全量自动化的理由。
    artifactIds:
      - io-complete-review
    metricIds:
