  - id: design-control-and-recovery
    order: 4
    stageId: product-experience
    status: verified
    title: 设计坐席控制与失败恢复
    question: 坐席怎样看见证据、识别不确定性、纠正回答并完成升级？
    decision: 展示原文、版本和适用条件，允许修改、驳回和转交，高风险与无证据问题保持发送前人工确认。
    facts:
      - id: kb-g4-human-authority
        kind: recommendation
        evidence: E2
        statement: 人工确认必须携带足够证据和真实权限，不能只在界面上增加一个形式化确认按钮。
      - id: kb-g4-injection-control
        kind: fact
        evidence: E3
        statement: RAG 不能完全缓解提示注入，外部文档中的内容可能通过间接注入改变模型行为或导致越权。
    unknowns:
      - id: kb-g4-review-capacity
        kind: unknown
        evidence: E0
        statement: 坐席复核时间、主管升级容量、高风险主题、响应时限和事件责任人仍待真实组织确认。
    options:
      - id: evidence-first-agent-control
        label: 证据优先的坐席控制
        assessment: recommended
        rationale: 坐席同时看到回答、原文、版本、风险原因和可执行动作，才可能有效判断是否发送或升级。
        conditions:
          - 关键主张和对应证据可以逐项核对
          - 坐席拥有修改、驳回、转交和停止权限
        risks:
          - 信息过多可能增加复核负担
          - 坐席仍可能因自动化偏差而盲信
        consequences:
          - 错误可以在外发前被发现和纠正
          - 纠正原因可进入评测与知识维护
        artifactDelta: 在责任恢复图中加入证据检查、拒答原因、升级上下文、超时和撤销路径。
      - id: review-every-draft
        label: 每条草稿都由坐席复核
        assessment: conditional
        rationale: 影子运行和早期校准阶段有价值，但长期可能增加重复劳动和确认疲劳。
        conditions:
          - 有明确的试运行期限和分层退出标准
          - 记录修改、驳回和无修改发送的真实原因
        risks:
          - 人工负担可能高于原流程
        consequences:
          - 获得纠正样本但吞吐受限
        artifactDelta: 在责任恢复图中标注全量复核仅用于校准阶段和退出条件。
      - id: auto-send-with-disclaimer
        label: 自动发送并附免责声明
        assessment: risky
        rationale: 免责声明不能修复错误知识、越权信息、无支持主张或缺失的人工责任。
        conditions:
          - 当前没有支持首版自动发送的条件
        risks:
          - 错误承诺直接触达客户
          - 安全与权限事件扩大
        consequences:
          - 当前阶段禁止该路径
        artifactDelta: 在责任恢复图中明确首版最终发送权属于授权坐席。
    artifactIds:
      - kb-responsibility-recovery
    metricIds:
