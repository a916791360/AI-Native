  - id: establish-value-and-data
    order: 2
    stageId: opportunity-judgment
    status: verified
    title: 建立价值与数据条件
    question: 怎样证明解决的是找到并使用正确知识，而不是只让回答更像人？
    decision: 先记录查找、核对、升级、纠正和错误版本基线，再定义有证据且经坐席确认的任务结果。
    facts:
      - id: kb-g2-task-outcome
        kind: recommendation
        evidence: E2
        statement: 回答流畅度不能单独证明业务价值，案例必须观察坐席能否完成真实回答任务并处理异常。
      - id: kb-g2-risk-context
        kind: fact
        evidence: E3
        statement: 生成系统可能自信地产生错误内容或虚假引用，风险需要结合具体使用情境和影响评估。
    unknowns:
      - id: kb-g2-real-baseline
        kind: unknown
        evidence: E0
        statement: 文档质量、问题分布、当前查找耗时、重复联系、升级结果和各类错误成本仍待真实数据验证。
    options:
      - id: baseline-supported-task
        label: 先建立有证据任务基线
        assessment: recommended
        rationale: 只有同时记录当前任务结果、证据和错误，才能判断新系统是否改善了值得解决的问题。
        conditions:
          - 明确坐席、知识负责人和升级责任人
          - 获取脱敏问题样本和有效知识版本
        risks:
          - 前期盘点会推迟演示
        consequences:
          - 后续指标可以映射到真实客服任务
          - 无答案和高风险切片会在开发前暴露
        artifactDelta: 在机会评估表中加入任务结果、知识条件、权限、错误成本和升级链路。
      - id: controlled-prototype-first
        label: 先做受控原型补问题清单
        assessment: conditional
        rationale: 原型可用于确认数据结构和输出形态，但不能被描述为业务价值已经成立。
        conditions:
          - 只处理授权的脱敏样本
          - 输出不对客户可见且不执行任何动作
        risks:
          - 团队可能把少量顺利样本外推为整体效果
        consequences:
          - 获得技术与数据缺口但不能得出上线结论
        artifactDelta: 在机会评估表中标注原型只验证可行性并列出待补业务基线。
      - id: fluency-as-success
        label: 用回答流畅度证明成功
        assessment: risky
        rationale: 语气自然不证明知识有效、引用支持、权限正确或客户问题得到解决。
        conditions:
          - 没有条件能让文风单独成为成功证据
        risks:
          - 错误答案因表达自信而更容易被采用
        consequences:
          - 无法建立可审计的上线与回滚门槛
        artifactDelta: 在机会评估表中记录否决原因并要求补齐任务与风险结果。
    artifactIds:
