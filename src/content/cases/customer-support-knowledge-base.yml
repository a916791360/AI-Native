id: customer-support-knowledge-base
title: 客服知识库与回答辅助
level: focus
domain: RAG 与客服产品
audience:
  - 零基础或初级 AI 产品经理
  - 需要评审客服知识助手的产品与业务人员
businessContext: 这是一个教学案例。某数字产品客服团队维护帮助中心、产品政策、故障处置手册和内部操作说明，希望为坐席提供可回到当前有效原文的回答草稿。
currentProcess:
  - 接收客户问题并识别客户、产品与问题类型
  - 搜索帮助中心、政策和内部处置手册
  - 检查文档版本、生效时间和适用条件
  - 起草回答并补充相关原文
  - 将高风险、无答案或冲突问题升级
  - 由坐席确认发送并记录处理结果
objective: 在知识版本、访问权限和原文证据可核验的前提下，提高坐席形成可发送回答的效率，并在证据不足或风险较高时可靠拒答和升级。
baseline:
  - id: kb-baseline-process-assumption
    kind: assumption
    evidence: E1
    statement: 当前搜索、核对、起草和升级流程只用于建立教学起点，不代表真实客服团队采用同样工具或存在效率问题。
  - id: kb-baseline-values-unknown
    kind: unknown
    evidence: E0
    statement: 实际问题分布、无答案比例、查找时间、错误成本、人工容量、延迟和单位成本均需要真实组织数据验证。
constraints:
  - id: kb-constraint-no-fabricated-thresholds
    kind: fact
    evidence: E2
    statement: AI-Native 不为教学完整性虚构检索、回答、引用、成本、延迟或上线阈值。
  - id: kb-constraint-human-send-authority
    kind: recommendation
    evidence: E1
    statement: 首版只辅助内部坐席，不自动对客回复，也不执行退款、改价、封禁、删除或其他外部动作。
  - id: kb-constraint-permission-enforcement
    kind: recommendation
    evidence: E3
    statement: 权限必须由检索和业务系统执行，检索内容作为不可信数据处理，不能取得系统指令或工具权限。
status: verified
updatedAt: 2026-08-04
verifiedAt: 2026-08-04

gates:
  - id: decide-ai-boundary
    order: 1
    stageId: model-boundaries
    status: verified
    title: 判断 AI 边界
    question: 这个场景需要生成式回答，还是搜索与固定话术已经足够？
    decision: 先治理有效知识和权限内搜索，只在跨片段归纳、语境适配和回答草稿步骤引入受限生成。
    facts:
      - id: kb-g1-external-knowledge
        kind: fact
        evidence: E3
        statement: RAG 把参数化生成与显式外部知识结合，研究动机包括知识更新和来源追踪问题。
      - id: kb-g1-deterministic-controls
        kind: recommendation
        evidence: E1
        statement: 文档有效期、访问权限、固定话术、风险主题和外发权限应由确定性系统控制。
    unknowns:
      - id: kb-g1-generation-need
        kind: unknown
        evidence: E0
        statement: 真实问题中有多少可由搜索或固定话术解决，以及多少确实需要跨片段生成，尚未通过工单样本验证。
    options:
      - id: governed-retrieval-copilot
        label: 治理优先的检索辅助
        assessment: recommended
        rationale: 先固定知识、权限和证据边界，再把生成限制为可核验草稿，能够分开控制风险和价值。
        conditions:
          - 文档具有所有者、版本、生效时间和权限字段
          - 回答关键主张可以定位到有效原文
        risks:
          - 知识治理会增加前期投入
          - 受限生成可能覆盖不了全部问题
        consequences:
          - 可逐步判断哪些步骤真正需要模型
          - 无证据问题可以安全转交人工
        artifactDelta: 在 AI 适用性卡中固定知识治理、搜索、生成和人工确认的责任边界。
      - id: search-and-template-only
        label: 搜索与固定话术优先
        assessment: conditional
        rationale: 当问题稳定且答案短小明确时，传统搜索和模板更可预测，也可能已经满足业务目标。
        conditions:
          - 查询与知识标题或关键词高度匹配
          - 话术适用条件和版本可以确定性维护
        risks:
          - 跨文档归纳和表达变化可能降低覆盖
        consequences:
          - 系统简单且成本可控
          - 复杂问题继续由坐席人工处理
        artifactDelta: 在 AI 适用性卡中记录仅搜索方案的覆盖范围和升级到生成的触发条件。
      - id: long-context-auto-answer
        label: 全量长上下文自动回答
        assessment: risky
        rationale: 上下文容量不代表证据会被稳定使用，也不能替代版本、权限、检索和引用核验。
        conditions:
          - 当前没有支持首版全量自动回答的条件
        risks:
          - 过期或无权限知识进入回答
          - 关键证据被长上下文噪声淹没
        consequences:
          - 当前方案不进入生产范围
        artifactDelta: 在 AI 适用性卡中记录否决长上下文自动回答的证据和重新评估条件。
    artifactIds:
