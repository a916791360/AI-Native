  - id: define-evaluation-and-cost
    order: 5
    stageId: quality-constraints
    status: verified
    title: 定义评测、成本与上线护栏
    question: 怎样同时评测检索、回答、引用、拒答、延迟和人工负担？
    decision: 使用版本化查询集和风险切片分步评测，并用有充分证据且经坐席确认的回答计算单位成功任务成本。
    facts:
      - id: kb-g5-human-calibration
        kind: fact
        evidence: E3
        statement: ARES 使用人工标注数据校准自动评估，支持自动评估扩大覆盖但不替代人工基准的边界。
      - id: kb-g5-layered-evaluation
        kind: recommendation
        evidence: E2
        statement: 案例需要分别观察知识发布、检索、生成、引用、拒答、任务结果、人工负担和运行质量。
    unknowns:
      - id: kb-g5-real-thresholds
        kind: unknown
        evidence: E0
        statement: 各风险切片的质量门槛、人工容量、延迟预算、单位成本和晋级回滚阈值仍待真实基线确定。
    options:
      - id: layered-evaluation-and-cost
        label: 分层评测与完整成本
        assessment: recommended
        rationale: 分层指标能定位失败来源，单位已确认回答成本则把模型、运行、失败和人工成本放回真实任务。
        conditions:
          - 查询集包含常见、无答案、冲突、高风险和权限切片
          - 每个候选版本在同一固定集和真实人工样本上比较
        risks:
          - 数据标注和持续维护成本较高
        consequences:
          - 上线与回滚可以基于可复核证据
          - 降本不会通过减少覆盖或过度拒答伪造
        artifactDelta: 在评测护栏表中加入分步指标、风险切片、单位成功成本和回滚触发项。
      - id: end-to-end-pilot-score
        label: 端到端试点分数作为补充
        assessment: conditional
        rationale: 端到端任务结果有业务意义，但必须与分步诊断并用，不能独立解释失败原因。
        conditions:
          - 同时保留检索、引用和拒答的步骤级结果
          - 试点问题与坐席样本具有明确范围
        risks:
          - 综合分数可能掩盖高风险少数类失败
        consequences:
          - 可以补充任务价值证据但不单独决定上线
        artifactDelta: 在评测护栏表中把端到端结果标为业务补充指标并附错误切片。
      - id: thumbs-up-and-token-cost
        label: 只看点赞与调用价格
        assessment: risky
        rationale: 点赞不保证答案有证据，调用价格也忽略知识治理、失败、运行和人工复核成本。
        conditions:
          - 没有条件支持用这两个指标替代完整评测
        risks:
          - 质量回退和人工负担被隐藏
          - 通过过度拒答或低覆盖制造漂亮结果
        consequences:
          - 当前方案不作为发布 Gate
        artifactDelta: 在评测护栏表中记录被排除的代理指标及其误导风险。
