  - id: select-workflow
    order: 3
    stageId: solution-choice
    status: verified
    title: 拆解检索与回答工作流
    question: 如何区分知识未入索引、召回失败、重排丢证据和生成未遵循证据？
    decision: 把知识发布、权限过滤、检索、重排、充分性判断、生成、引用和拒答拆成可观察步骤。
    facts:
      - id: kb-g3-separate-rag-dimensions
        kind: fact
        evidence: E3
        statement: RAG 评测研究分别观察上下文相关性、答案忠实度和答案相关性，而不是只给最终回答一个总分。
      - id: kb-g3-position-sensitivity
        kind: fact
        evidence: E3
        statement: 长上下文模型对相关信息位置的使用可能不稳定，因此候选重排和位置切片需要单独测试。
    unknowns:
      - id: kb-g3-retrieval-shape
        kind: unknown
        evidence: E0
        statement: 真实语料适合的切分、关键词与语义检索组合、候选数量、重排和上下文长度尚未比较。
    options:
      - id: observable-rag-pipeline
        label: 可观察的分步 RAG 流程
        assessment: recommended
        rationale: 分步契约能定位知识发布、检索、重排、生成和引用中的具体失败，并支持局部回退。
        conditions:
          - 每一步记录输入、输出、版本、状态和失败原因
          - 无证据和冲突状态可以在生成前停止
        risks:
          - 编排、日志和评测成本增加
        consequences:
          - 可以针对失败步骤改进而不是反复调 Prompt
          - 可以替换单个组件而不重建全部流程
        artifactDelta: 在 RAG 诊断表中固定知识发布、检索、重排、生成、引用和拒答的输入输出。
      - id: simple-retrieve-and-draft
        label: 简化检索后生成草稿
        assessment: conditional
        rationale: 在小型、单一来源、低风险知识集中可作为对照基线，但仍需权限和引用校验。
        conditions:
          - 知识来源单一且版本冲突很少
          - 所有回答仍由坐席检查后发送
        risks:
          - 无法充分诊断重排和充分性问题
        consequences:
          - 原型路径较短但扩展能力有限
        artifactDelta: 在 RAG 诊断表中标记简化流程的适用范围和必须保留的控制。
      - id: final-answer-only-debugging
        label: 只看最终回答调试
        assessment: risky
        rationale: 最终错误可能来自文档、索引、查询、召回、重排或生成，只看成文无法可靠归因。
        conditions:
          - 没有条件支持把最终回答当作唯一诊断信号
        risks:
          - 团队反复调整模型却忽略检索失败
          - 局部质量回退无法被发现
        consequences:
          - 当前方案不进入生产评测设计
        artifactDelta: 在 RAG 诊断表中记录各步骤必须暴露的观测信号和固定反例。
    artifactIds:
      - kb-workflow-selection
    metricIds:
