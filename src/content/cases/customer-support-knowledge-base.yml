  - id: govern-launch-and-iteration
    order: 6
    stageId: capstone
    status: verified
    title: 治理发布与持续更新
    question: 什么时候能扩大自动化，知识更新或质量回退时如何停止？
    decision: 按离线回放、影子建议、坐席草稿和受限自动回复逐级推进，每级绑定通过条件、责任人和回滚动作。
    facts:
      - id: kb-g6-staged-authority
        kind: recommendation
        evidence: E2
        statement: 自动化权限应随知识、质量、人工负担和运行证据逐级扩大，而不是在首版一次开放。
      - id: kb-g6-continuous-risk
        kind: fact
        evidence: E3
        statement: 生成系统风险会随使用情境、输入、组件和生命周期阶段变化，需要持续测量、事件响应和版本治理。
    unknowns:
      - id: kb-g6-promotion-criteria
        kind: unknown
        evidence: E0
        statement: 真实组织的晋级审批人、低风险主题、监控窗口、事件阈值和回滚时限尚未确认。
    options:
      - id: evidence-gated-release
        label: 证据门禁的分级发布
        assessment: recommended
        rationale: 每一级只增加有限权限，并保留上一稳定流程，能够在获得真实证据前限制错误影响范围。
        conditions:
          - 每级明确范围、责任人、通过条件和回滚动作
          - 知识更新和固定查询集在发布前通过回归
        risks:
          - 发布节奏慢且需要持续运营投入
        consequences:
          - 质量回退或知识异常可以局部停止
          - 自动化范围与证据强度保持一致
        artifactDelta: 在完整评审档案中加入四级权限、晋级证据、持续监控、事件响应和回滚表。
      - id: limited-low-risk-auto-answer
        label: 受限低风险自动回复
        assessment: conditional
        rationale: 只有低风险、高证据、稳定知识主题在坐席草稿阶段持续达标后，才可作为后续候选。
        conditions:
          - 主题范围、答案模板和停机开关均已批准
          - 引用、拒答、权限和知识新鲜度持续达到真实门槛
        risks:
          - 主题边界漂移会让高风险问题误入自动回复
        consequences:
          - 可减少简单重复任务但必须保留即时回退
        artifactDelta: 在完整评审档案中记录自动回复白名单、监控和退回坐席草稿的条件。
      - id: broad-first-release
        label: 首版面向全部客户自动回答
        assessment: risky
        rationale: 当前没有真实质量、人工容量、知识时效或错误成本证据支持扩大到全部问题和客户。
        conditions:
          - 当前没有可接受条件
        risks:
          - 错误知识、无证据回答和越权信息同时扩大
          - 出现事件时难以快速确定受影响范围
        consequences:
          - 当前阶段禁止该路径
        artifactDelta: 在完整评审档案中记录否决广泛自动回复的理由和未来重新评估证据。
    artifactIds:
      - kb-complete-review
    metricIds:
      - supported-answer-completion
      - appropriate-abstention-rate
      - knowledge-freshness-lag
      - escalation-queue-age
      - unit-confirmed-answer-cost
      - permission-violation-count
    failureModeIds:
      - stale-document-retrieved
      - knowledge-index-lag
      - permission-filter-failure
      - review-queue-overload
      - version-regression
    referenceIds:
      - source-nist-genai-profile
      - source-owasp-prompt-injection
      - term-canary-release
      - term-rollback
      - term-observability
      - term-human-escalation

artifacts:
  - id: kb-ai-applicability
    type: ai-applicability
    title: AI 适用性与不可自动化边界卡
    summary: 区分知识治理、权限搜索、生成草稿与坐席最终发送，记录不使用生成和禁止自动化的范围。
  - id: kb-opportunity-assessment
    type: opportunity-assessment
    title: 客服知识机会评估表
    summary: 记录目标角色、当前任务、知识条件、权限、真实基线、错误成本、无答案和升级链路。
  - id: kb-workflow-selection
    type: workflow-selection
    title: RAG 诊断与方案选择表
    summary: 固定知识发布、检索、重排、充分性、生成、引用和拒答步骤及各自输入输出与终止条件。
  - id: kb-responsibility-recovery
    type: responsibility-recovery
    title: 坐席权限、升级与恢复图
    summary: 标明证据检查、修改、驳回、转交、超时、事件响应和最终发送的人员与系统权限。
  - id: kb-evaluation-guardrails
    type: evaluation-guardrails
    title: RAG 评测、成本与上线护栏表
    summary: 组合固定查询集、风险切片、分步质量、人工负担、单位成功成本、延迟和回滚条件。
  - id: kb-complete-review
    type: complete-review
    title: 完整客服知识产品评审档案
    summary: 汇总六关决策、四级发布权限、知识更新、持续监控、事件响应、晋级和回滚证据。

metrics:
  - id: supported-answer-completion
    category: business
    label: 有证据回答任务完成率
    definition: 有充分有效证据且经授权坐席确认完成的回答任务，占进入目标范围问题的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: evidence-search-time
    category: business
    label: 有效证据查找时间
    definition: 从坐席开始查找，到定位当前有效且适用于该问题的原文证据所需时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: retrieval-recall-risk-slices
    category: quality
    label: 风险切片检索召回
    definition: 在高风险、无答案、冲突和常见主题切片中，必要证据进入候选集合的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: retrieval-precision
    category: quality
    label: 检索精确率
    definition: 返回候选中与当前问题、客户条件和有效知识范围相关的证据所占比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: citation-support-rate
    category: quality
    label: 引用支持率
    definition: 回答关键主张中，其引用真实存在、版本有效且原文确实支持该主张的比例。
    desiredDirection: increase
    thresholdStatus: baseline-needed
  - id: appropriate-abstention-rate
    category: quality
    label: 合理拒答率
    definition: 在无证据、知识冲突、权限不足或高风险问题上正确拒答或升级，同时不过度拒绝可回答问题的表现。
    desiredDirection: range
    thresholdStatus: baseline-needed
  - id: knowledge-freshness-lag
    category: operation
    label: 知识新鲜度延迟
    definition: 有效知识发布或下架后，到检索系统正确反映该版本状态之间的端到端时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: p95-draft-latency
    category: operation
    label: P95 草稿延迟
    definition: 从提交已授权问题到返回可供坐席复核草稿的第九十五百分位端到端时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: human-review-time
    category: human
    label: 坐席复核时间
    definition: 坐席核对证据、修改、驳回或确认一条回答草稿所投入的人工时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: escalation-queue-age
    category: human
    label: 升级队列时长
    definition: 无答案、高风险或冲突问题从进入人工升级队列到由责任人接手的等待时间。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: unit-confirmed-answer-cost
    category: cost
    label: 单位已确认回答成本
    definition: 知识治理、索引、检索、生成、失败运行和人工复核总成本除以有充分证据且经坐席确认的回答数。
    desiredDirection: decrease
    thresholdStatus: baseline-needed
  - id: permission-violation-count
    category: operation
    label: 权限违规输出数
    definition: 检索或回答向当前坐席、客户或租户暴露无权访问知识的事件数量。
    desiredDirection: guardrail
    thresholdStatus: defined
    threshold: 任何权限违规均阻止晋级并触发事件响应

failureModes:
  - id: stale-document-retrieved
    title: 过期文档仍可检索
    signal: 回答引用旧版本、已下架政策或错误生效日期
    impact: 坐席可能依据无效规则对客户作出错误说明或承诺
    recovery: 停止相关来源、重建索引、回放受影响查询并退回人工搜索
    owner: 知识负责人和工程
  - id: knowledge-index-lag
    title: 新知识未及时入索引
    signal: 已发布有效内容持续无法召回或下架内容仍然返回
    impact: 回答遗漏最新政策或继续使用已经失效的知识
    recovery: 检查发布队列和缓存失效，标记知识不可用并回退人工流程
    owner: 知识负责人和工程
  - id: permission-filter-failure
    title: 权限过滤失败
    signal: 返回其他租户、客户或未授权内部资料
    impact: 造成敏感信息暴露、合规风险和客户信任损害
    recovery: 阻断输出、停用相关索引、保全日志并启动安全事件响应
    owner: 安全和工程
  - id: retrieval-miss
    title: 关键证据召回失败
    signal: 有效来源存在但未进入候选集合
    impact: 系统可能错误拒答或在缺少关键条件时生成答案
    recovery: 保持无答案状态并升级，修复查询、切分或检索后回放固定样本
    owner: 检索和评测负责人
  - id: reranker-drops-evidence
    title: 重排截断关键证据
    signal: 相关来源已召回却未进入最终上下文
    impact: 答案遗漏关键限制、例外或适用条件
    recovery: 调整候选与重排策略，运行证据位置和风险切片回归
    owner: 检索和评测负责人
  - id: unsupported-citation
    title: 引用不支持回答主张
    signal: 引用可打开但原文与回答结论不一致
    impact: 坐席可能因看见引用而错误信任无依据回答
    recovery: 阻止发送，删除或重写不受支持主张，并把失败加入固定集
    owner: 坐席和评测负责人
  - id: knowledge-source-conflict
    title: 有效知识来源冲突
    signal: 多份当前有效文档对同一条件给出不同规则
    impact: 系统可能任意选边并形成错误对客承诺
    recovery: 不自动裁决，展示冲突并转交知识负责人确认唯一有效规则
    owner: 知识负责人
  - id: answer-without-evidence
    title: 无答案时仍然作答
    signal: 检索为空或证据不足时仍给出确定回答
    impact: 模型编造可能直接影响客户处理和业务责任
    recovery: 强制拒答并进入人工队列，检查充分性和生成护栏
    owner: 产品和客服主管
  - id: indirect-prompt-injection
    title: 间接提示注入
    signal: 检索文档试图改变指令、请求敏感数据或调用工具
    impact: 模型行为可能被外部内容操纵并导致越权或错误输出
    recovery: 将文档按不可信数据隔离，阻止动作并启动安全审查和攻击回放
    owner: 安全和工程
  - id: review-queue-overload
    title: 人工升级队列过载
    signal: 队龄、积压、超时和未处理高风险问题持续上升
    impact: 形式上的人在回路无法在业务时限内提供真实保护
    recovery: 收紧自动化范围、按风险排序并调整责任人与容量
    owner: 客服主管
  - id: model-timeout
    title: 模型或重排服务超时
    signal: 草稿延迟、失败率或重试量突然升高
    impact: 坐席等待增加且重复调用推高成本
    recovery: 达到上限后停止重试，降级到搜索与人工起草并记录失败
    owner: 工程
  - id: version-regression
    title: 版本升级质量回退
    signal: 固定集、风险切片或线上纠正指标相对稳定版本下降
    impact: 质量可能在没有明显系统错误时静默恶化
    recovery: 冻结候选版本并回滚模型、提示、索引或重排到上一稳定组合
    owner: 产品、工程和评测负责人

